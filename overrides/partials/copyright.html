{#-
  untool.ai footer: legal links + copyright. Overrides Material's default copyright partial
  (theme.custom_dir). Links use the `url` filter so paths resolve correctly under the site root.
-#}
<div class="md-copyright">
  <div class="md-copyright__highlight">
    <a href="{{ 'legal/privacy/' | url }}">Privacy</a> ·
    <a href="{{ 'legal/terms/' | url }}">Terms</a> ·
    <a href="{{ 'legal/notice/' | url }}">Legal Notice</a>
  </div>
  {% if config.copyright %}
    <div class="md-copyright__highlight">{{ config.copyright }}</div>
  {% endif %}
</div>
