site_name: AgentArmyPowerTemplate
site_description: Reusable AI-powered GitHub and Markdown workflow template
site_author: AgentArmyPowerTemplate contributors
site_url: https://nickpclarke.github.io/AgentArmyPowerTemplate/
repo_url: https://github.com/nickpclarke/AgentArmyPowerTemplate
repo_name: nickpclarke/AgentArmyPowerTemplate
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright © 2026 AgentArmyPowerTemplate contributors. Licensed under MIT.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight

plugins:
  - search

exclude_docs: |
  includes/
  decisions/ARC-ADR-DRAFT-*.md

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - docs
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - footnotes
  - md_in_html

extra_css:
  - stylesheets/theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nickpclarke/AgentArmyPowerTemplate

nav:
  - Home: index.md
  - Getting Started:
      - Setup & Installation: setup.md
      - Quick Start Guide: quick-start.md
      - Team Onboarding Checklist: onboarding.md
      - Contributing Standards: contributing.md
  - Armies & Roster:
      - Armies Overview: armies-overview.md
      - Complete Agent Roster: agents.md
      - Complete Agent Glossary: agents-glossary/index.md
      - Agent Routing Matrix: routing-matrix.md
      - Agent Routing Reference: agent-routing.md
      - Agent Synchronization: agent-sync.md
      - Optional Memory Palace: mempalace.md
  - GitHub Workflow Practices:
      - GitHub Projects v2: github-projects.md
      - Issue Schema & Conventions: issue-conventions.md
      - PR Autonomous Review Loop: pr-review-loop.md
      - Human-in-the-Loop Decisions: hitl.md
      - GitHub Copilot Configuration: copilot.md
      - Codex Environment Setup: codex.md
  - Planning & Strategic Delivery:
      - Lightweight SAFe Delivery: safe.md
      - Wardley Mapping Strategy: wardley.md
      - Capability Mapping Strategy: capability-maps.md
  - Architectural Decisions:
      - ADR Overview & Rules: architecture-decisions.md
      - ADR Directory: decisions/README.md
      - Terminology Glossary: glossary.md
