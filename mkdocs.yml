site_name: AgentArmy
site_description: AI-powered software development template with coordinated Claude Code, GitHub Copilot, and dlt agents
site_author: nickpclarke
site_url: https://nickpclarke.github.io/AgentArmy/
repo_url: https://github.com/nickpclarke/AgentArmy
repo_name: AgentArmy
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright © 2024 Nick Clarke. All rights reserved.

theme:
  name: material
  logo: null
  favicon: null
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  # untool.ai brand: warm paper/ink, ONE blue accent. Exact tokens come from
  # docs/stylesheets/untool.css (sourced from frontend-core fleet.css + brand manifesto).
  # palette = custom so Material applies our CSS vars, not its stock indigo.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  # Brand uses a system type stack (one type family, no fonts of intimidation).
  font: false
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.prune
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tooltips
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share

plugins:
  - search:
      lang: en
      separator: '[\\s\\-,:!=\\[\\]()"/]+|(?<!\\w)(?=\\w)|(?!\\w)(?=\\w)'
  # Expands the `platform/` directory nav entry (synced spoke docs) from the file
  # tree, so newly-synced spoke pages appear with no hand-editing of nav.
  - awesome-pages

# docs/includes/abbreviations.md is a snippet auto-appended to every page, not a standalone page
exclude_docs: |
  includes/

markdown_extensions:
  - abbr          # renders <abbr> tooltips from docs/includes/abbreviations.md (the "meaning unpacker")
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md   # append acronym defs to every page so abbr tooltips render site-wide
      base_path:
        - docs
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - footnotes
  - md_in_html

extra_css:
  - stylesheets/untool.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nickpclarke/AgentArmy
      name: GitHub Repository

