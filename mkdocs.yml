site_name: AgentArmyPowerTemplate
site_description: Reusable AI-powered GitHub and Markdown workflow template
site_author: AgentArmyPowerTemplate contributors
site_url: https://nickpclarke.github.io/AgentArmyPowerTemplate/
repo_url: https://github.com/nickpclarke/AgentArmyPowerTemplate
repo_name: nickpclarke/AgentArmyPowerTemplate
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright © 2026 AgentArmyPowerTemplate contributors. Licensed under MIT.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight

plugins:
  - search

exclude_docs: |
  includes/

markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
      base_path:
        - docs
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - attr_list
  - footnotes
  - md_in_html

extra_css:
  - stylesheets/theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nickpclarke/AgentArmyPowerTemplate
      name: GitHub Repository

nav:
  - Home: index.md
  - Getting Started:
      - Setup: setup.md
      - Quick Start: quick-start.md
      - Onboarding: onboarding.md
      - Contributing: contributing.md
  - GitHub Practices:
      - GitHub Projects: github-projects.md
      - Issue Conventions: issue-conventions.md
      - PR Review Loop: pr-review-loop.md
      - Human-in-the-Loop: hitl.md
      - Copilot: copilot.md
      - Codex: codex.md
  - Agent Guidance:
      - Starter Agents: agents.md
      - Generated Agent Glossary: agents-glossary/index.md
      - Routing Matrix: routing-matrix.md
      - Optional MemPalace: mempalace.md
  - Planning & Delivery:
      - SAFe: safe.md
      - Wardley Mapping: wardley.md
      - Capability Maps: capability-maps.md
  - ADRs & Markdown:
      - Architecture Decisions: architecture-decisions.md
      - ADR Directory: decisions/README.md
      - Glossary: glossary.md
