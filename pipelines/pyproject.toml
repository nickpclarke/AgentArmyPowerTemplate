[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentarmy-pipelines"
version = "1.0.0"
description = "dlt-powered demo data pipeline toolkit for AgentArmy AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentArmy", email = "nick@livecreative.com" }]
keywords = ["dlt", "data-pipeline", "etl", "duckdb", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "dlt[duckdb]>=0.5",
    "pandas>=2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.10",
    "lxml>=5.0",
]

[project.optional-dependencies]
unstructured = [
    "unstructured[pdf,docx]>=0.13",
]
dev = [
    "pytest>=8",
    "pytest-dlt",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dlt_pipelines*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
