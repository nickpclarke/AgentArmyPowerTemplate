services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
