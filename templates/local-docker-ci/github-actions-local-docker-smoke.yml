name: Local Docker Smoke Test

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when LOCAL_DOCKER_SMOKE_ENABLED is not true"
        required: false
        default: false
        type: boolean
      compose_file:
        description: "Compose file to smoke test"
        required: false
        default: "compose.yaml"
        type: string

permissions:
  contents: read

concurrency:
  group: local-docker-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-docker-smoke:
    if: ${{ inputs.force == true || inputs.force == 'true' || vars.LOCAL_DOCKER_SMOKE_ENABLED == 'true' }}
    runs-on: [self-hosted, docker-local]
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}-local-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Verify Docker on local runner
        shell: powershell
        run: |
          docker version
          docker compose version

      - name: Run compose smoke stack
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath "${{ inputs.compose_file }}")) {
            throw "Compose file not found: ${{ inputs.compose_file }}"
          }
          docker compose -f "${{ inputs.compose_file }}" up --detach --build
          docker compose -f "${{ inputs.compose_file }}" ps
          node tools/agentarmy-doctor.mjs --strict --write-artifacts --format markdown --output tests/artifacts/doctor/summary.md

      - name: Capture compose smoke logs
        if: always()
        shell: powershell
        run: |
          cmd /c "docker compose -f ""${{ inputs.compose_file }}"" logs --no-color > docker-compose-smoke.log 2>&1"
          docker compose -f "${{ inputs.compose_file }}" ps | Out-File -Encoding utf8 docker-compose-ps.txt
        continue-on-error: true

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-docker-smoke
          path: |
            tests/artifacts/doctor/
            docker-compose-smoke.log
            docker-compose-ps.txt
          if-no-files-found: ignore

      - name: Cleanup local Docker resources
        if: always()
        shell: powershell
        run: docker compose -f "${{ inputs.compose_file }}" down --remove-orphans
        continue-on-error: true
