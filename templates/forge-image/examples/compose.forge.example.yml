# Example local compose for the agentarmy-forge image.
#
# Brings up the FastAPI server on :8086 with a dev HMAC secret + a writable
# `/work/out` for generated files. Persists nothing — every run starts fresh.
services:
  forge:
    container_name: agentarmy-forge
    build: ..
    image: agentarmy-forge:local
    environment:
      MODE: ${MODE:-serve}
      FORGE_PORT: "8086"
      FORGE_OUT_DIR: /work/out
      # Dev-only secret. In prod, mount via secret store + WEBHOOK_HMAC_SECRET_FILE.
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-dev-secret-rotate-me}
      # Optional — point at a backend-core /ontology/snapshot if available.
      FORGE_DEFAULT_UPSTREAM: ${FORGE_DEFAULT_UPSTREAM:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8086:8086"
    # Use host-gateway so the doctor's localhost http.server on the host
    # (or another container) is reachable from inside.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - forge-work-cache:/work
    healthcheck:
      # /livez is cheap + safe.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/livez >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  forge-work-cache:
