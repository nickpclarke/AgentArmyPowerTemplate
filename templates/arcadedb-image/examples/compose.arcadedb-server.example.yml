# Run THIS image (the server side) with file-mounted secrets.
# Companion to templates/local-docker-ci/compose.arcadedb-secret.example.yml,
# which shows the CLIENT side (a backend pointing at ArcadeDB).
#
# Secrets come from ./.secrets/*.txt (keep that dir gitignored — commit only the
# placeholder README). See docs/arcadedb-secret-hardening.md.

services:
  arcadedb:
    build:
      context: ..
      dockerfile: Dockerfile
    image: agentarmy-arcadedb:local
    ports:
      - "2480:2480"
    environment:
      ARCADEDB_DATABASE: knowledge
      ARCADEDB_SERVICE_USER: platform_reader
      ARCADEDB_ROOT_PASSWORD_FILE: /run/secrets/arcadedb_root_password
      ARCADEDB_SERVICE_PASSWORD_FILE: /run/secrets/arcadedb_password
    secrets:
      - arcadedb_root_password
      - arcadedb_password
    # Persist config + databases TOGETHER: the read-only service user lives in
    # config/server-users.jsonl, the data lives in databases/. Keeping only one
    # would desync the user from the data on recreate.
    volumes:
      - arcadedb_config:/home/arcadedb/config
      - arcadedb_data:/home/arcadedb/databases

secrets:
  arcadedb_root_password:
    file: ./.secrets/arcadedb_root_password.txt
  arcadedb_password:
    file: ./.secrets/arcadedb_password.txt

volumes:
  arcadedb_config:
  arcadedb_data:
