name: Local Docker Gate To Azure Dev

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to validate and promote. Defaults to the current ref."
        required: false
        default: ""
        type: string
      dev_branch:
        description: "Dev source branch watched by ACR Tasks."
        required: false
        default: "azure-dev"
        type: string
      cli_test_command:
        description: "Optional CLI test command to run after Docker build."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: local-docker-gate-to-azure-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-docker-gate:
    runs-on: [self-hosted, docker-local]
    environment: local-docker
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}-gate-${{ github.run_id }}
      DEV_BRANCH: ${{ inputs.dev_branch || vars.AZURE_DEV_SOURCE_BRANCH || 'azure-dev' }}
      SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
      CLI_TEST_COMMAND: ${{ inputs.cli_test_command }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Verify local Docker runner
        shell: powershell
        run: |
          docker version
          docker compose version

      - name: Run AgentArmy diagnostics
        shell: powershell
        run: node tools/agentarmy-doctor.mjs --write-artifacts --format markdown --output tests/artifacts/doctor/summary.md

      - name: Build local Docker image
        shell: powershell
        run: |
          $image = "${{ github.event.repository.name }}:local-gate-${{ github.run_id }}"
          "LOCAL_GATE_IMAGE=$image" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          docker build --pull --tag "$image" .

      - name: Run optional CLI tests
        if: ${{ inputs.cli_test_command != '' }}
        shell: powershell
        run: |
          Invoke-Expression "$env:CLI_TEST_COMMAND"

      - name: Run compose smoke when compose file exists
        shell: powershell
        run: |
          $compose = @("compose.yaml", "docker-compose.yaml") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($compose) {
            docker compose -f $compose up --detach --build
            docker compose -f $compose ps
          } else {
            Write-Host "No compose file found; Docker image build is the smoke proof for this repo."
          }

      - name: Capture local Docker evidence
        if: always()
        shell: powershell
        run: |
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}" | Out-File -Encoding utf8 docker-ps.txt
          $compose = @("compose.yaml", "docker-compose.yaml") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($compose) {
            docker compose -f $compose logs --no-color *> docker-compose-gate.log
          }
        continue-on-error: true

      - name: Promote Dev source branch
        shell: powershell
        run: |
          git config user.name "agentarmy-local-docker-gate"
          git config user.email "agentarmy-local-docker-gate@users.noreply.github.com"
          git fetch origin "$env:DEV_BRANCH" --depth=1 2>$null
          git branch --force "$env:DEV_BRANCH" HEAD
          git push origin "$env:DEV_BRANCH" --force-with-lease

      - name: Upload local gate artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-docker-gate
          path: |
            tests/artifacts/doctor/
            docker-ps.txt
            docker-compose-gate.log
          if-no-files-found: ignore

      - name: Cleanup local Docker resources
        if: always()
        shell: powershell
        run: |
          $compose = @("compose.yaml", "docker-compose.yaml") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if ($compose) {
            docker compose -f $compose down --remove-orphans
          }
          if ($env:LOCAL_GATE_IMAGE) {
            docker image rm "$env:LOCAL_GATE_IMAGE"
          }
        continue-on-error: true
