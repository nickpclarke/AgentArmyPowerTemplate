# Example local compose for the AgentArmy local-embedder image.
#
# Persists the HuggingFace model cache on a named volume so model weights
# don't re-download on every restart (BAAI/bge-small-en-v1.5 is ~133 MB).
services:
  embedder:
    container_name: local-embedder
    build: ..
    image: agentarmy-local-embedder:local
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDER_DEVICE: ${EMBEDDER_DEVICE:-cpu}
      EMBEDDER_NORMALIZE: ${EMBEDDER_NORMALIZE:-true}
      EMBEDDER_MAX_BATCH: ${EMBEDDER_MAX_BATCH:-64}
      EMBEDDER_PORT: "8082"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8082:8082"
    volumes:
      - embedder-model-cache:/home/embedder/.cache/huggingface
    healthcheck:
      # /livez is cheap + safe — doesn't require the model to be loaded.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/livez >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  embedder-model-cache:
