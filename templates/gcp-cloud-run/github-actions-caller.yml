# Spoke caller — copy to a spoke repo at .github/workflows/deploy.yml.
# Promotes a build across landscapes (dev -> qa -> uat -> prod), each mapped to a
# GitHub Environment so prod can require reviewers and each env carries its own
# scoped secrets (WORKLOAD_IDENTITY_PROVIDER, DEPLOY_SERVICE_ACCOUNT).
#
# Prerequisites per environment (via terraform/ or setup/bootstrap-wif.sh):
#   - a GCP project + Workload Identity Federation scoped to THIS repo
#   - a GitHub Environment (dev/qa/uat/prod) holding that env's two secrets
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # REQUIRED in the caller for keyless Workload Identity Federation

jobs:
  # Non-prod landscapes deploy automatically.
  nonprod:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - environment: dev
            project_id: my-app-dev
            allow_unauthenticated: true
          - environment: qa
            project_id: my-app-qa
            allow_unauthenticated: false
          - environment: uat
            project_id: my-app-uat
            allow_unauthenticated: false
    uses: nickpclarke/AgentArmy/.github/workflows/gcp-cloud-run-deploy.yml@main
    with:
      environment: ${{ matrix.environment }}
      project_id: ${{ matrix.project_id }}
      region: us-central1
      service: my-service
      allow_unauthenticated: ${{ matrix.allow_unauthenticated }}
      set_secrets: "DB_PASSWORD=db-password:latest,API_KEY=api-key:latest"
    secrets: inherit

  # Prod waits for non-prod, then deploys through a protected GitHub Environment
  # (configure required reviewers on the "prod" environment to gate it).
  prod:
    needs: nonprod
    uses: nickpclarke/AgentArmy/.github/workflows/gcp-cloud-run-deploy.yml@main
    with:
      environment: prod
      project_id: my-app-prod
      region: us-central1
      service: my-service
      allow_unauthenticated: false
      set_secrets: "DB_PASSWORD=db-password:latest,API_KEY=api-key:latest"
    secrets: inherit
