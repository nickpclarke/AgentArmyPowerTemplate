# Cloud Build pipeline: build container -> push Artifact Registry -> deploy Cloud Run.
#
# Run manually:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SERVICE=my-svc,_REGION=us-central1,_REPOSITORY=containers
#
# Or attach a Cloud Build trigger to your repo (gcloud builds triggers create github ...).
# SHORT_SHA is populated automatically for trigger builds; for `builds submit` it is
# empty unless you pass it, so we fall back to BUILD_ID below.

substitutions:
  _REGION: us-central1
  _REPOSITORY: containers
  _SERVICE: my-service
  _ALLOW_UNAUTH: "false"
  # Runtime service account with roles/secretmanager.secretAccessor (optional).
  _RUNTIME_SA: ""
  # Secret Manager wiring, e.g. "DB_PASSWORD=db-password:latest,API_KEY=api-key:latest" (optional).
  _SET_SECRETS: ""

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}"

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        TAG="${SHORT_SHA:-${BUILD_ID}}"
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}"
        docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        TAG="${SHORT_SHA:-${BUILD_ID}}"
        IMAGE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${TAG}"

        FLAGS=( "--region=${_REGION}" "--platform=managed" "--quiet" )
        if [ "${_ALLOW_UNAUTH}" = "true" ]; then
          FLAGS+=( "--allow-unauthenticated" )
        else
          FLAGS+=( "--no-allow-unauthenticated" )
        fi
        [ -n "${_RUNTIME_SA}" ]  && FLAGS+=( "--service-account=${_RUNTIME_SA}" )
        [ -n "${_SET_SECRETS}" ] && FLAGS+=( "--set-secrets=${_SET_SECRETS}" )

        gcloud run deploy "${_SERVICE}" --image="${IMAGE}" "${FLAGS[@]}"
