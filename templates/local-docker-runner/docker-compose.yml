# Local self-hosted GitHub Actions runners for the AgentArmy fleet — EPHEMERAL POOL.
#
# Free, unmetered CI on your own machine — self-hosted minutes don't count against the
# GitHub-hosted quota. Each runner is EPHEMERAL: it registers, runs exactly one job, then
# exits; Docker restarts it so it re-registers fresh. A clean container per job, no leakage.
#
# Pool size = `replicas` per repo = max concurrent jobs that repo can run locally.
# Rule of thumb: replicas ≈ min(cores, RAM_GB / 2) — RAM (~2 GB/job) is usually the cap.
#
# Prereqs: Docker Desktop running. A classic GitHub PAT with `repo` scope (private repos).
#
# Start (default 1 runner/repo = 4 total — one per repo, the original layout):
#   export GH_PAT=ghp_xxx          # do NOT commit; or copy .env.example -> .env
#   docker compose up -d
#
# Use a lot of capacity (e.g. 8 runners/repo = 32 total):
#   LOCAL_RUNNERS_PER_REPO=8 docker compose up -d
# Or scale one repo on the fly:
#   docker compose up -d --scale runner-middle=12
#
# Watch / stop:
#   docker compose logs -f
#   docker compose down           # graceful; ephemeral runners drop out of the repo
#
# Runners auto-carry `self-hosted, Linux, X64` plus `agentarmy, local, docker-local`.
#   runs-on: [self-hosted, linux]         -> these OR the always-on ACA runners
#   runs-on: [self-hosted, docker-local]  -> ONLY here (Docker/browsers; ACA can't)
name: agentarmy-runners

x-runner: &runner
  image: myoung34/github-runner:latest
  # Ephemeral runners exit after one job; restart respawns them to re-register.
  restart: unless-stopped
  environment: &runner-env
    ACCESS_TOKEN: ${GH_PAT:?set GH_PAT in your shell or .env (classic PAT, repo scope)}
    RUNNER_SCOPE: repo
    ORG_NAME: ""
    EPHEMERAL: "1"
    # `docker-local` routes docker-build / browser jobs here (ACA can't do Docker — no DIND).
    LABELS: agentarmy,local,docker-local
    DISABLE_AUTO_UPDATE: "true"
    # setup-dotnet installs here (writable) instead of root-only /usr/share/dotnet.
    DOTNET_INSTALL_DIR: /home/runner/.dotnet
    # Shared on-host caches (the runner-caches volume, below) so each EPHEMERAL
    # runner reuses already-downloaded packages instead of re-fetching the whole
    # tree every job. Cures the cold-cache installs that timed out heavy pip pulls.
    PIP_CACHE_DIR: /caches/pip
    npm_config_cache: /caches/npm
    CARGO_HOME: /caches/cargo
  security_opt:
    - no-new-privileges:true
  # Host Docker socket (Docker-out-of-Docker) so `docker build` / Playwright use your daemon.
  # Grants jobs host-daemon (root-equivalent) access — PRIVATE repos + your own agents only.
  # Work dir stays on the normal (exec-able) container fs — NOT a tmpfs (noexec breaks
  # setup-python: "./python: failed to map segment from shared object").
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    # Shared, persistent package caches across all ephemeral runners (volume below).
    - runner-caches:/caches
  # Don't register until the shared cache dirs exist and are writable.
  depends_on:
    cache-init:
      condition: service_completed_successfully

services:
  # One-shot: create the shared cache dirs and make them world-writable BEFORE any
  # runner starts. The runners run jobs as the non-root `runner` user, so a freshly
  # created (root-owned) named volume would otherwise be unwritable and silently
  # skip caching. Runs once per `up`, then exits.
  cache-init:
    image: busybox
    restart: "no"
    command: sh -c "mkdir -p /caches/pip /caches/npm /caches/cargo && chmod -R 0777 /caches"
    volumes:
      - runner-caches:/caches

  # One scalable service per repo (runners register per-repo on a user account).
  # No container_name / fixed RUNNER_NAME — both are incompatible with replicas.
  runner-hub:
    <<: *runner
    deploy:
      replicas: ${LOCAL_RUNNERS_PER_REPO:-1}
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/AgentArmy
      RUNNER_NAME_PREFIX: aa-hub

  runner-frontend:
    <<: *runner
    deploy:
      replicas: ${LOCAL_RUNNERS_PER_REPO:-1}
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/frontend-core
      RUNNER_NAME_PREFIX: aa-fe

  runner-backend:
    <<: *runner
    deploy:
      replicas: ${LOCAL_RUNNERS_PER_REPO:-1}
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/backend-core
      RUNNER_NAME_PREFIX: aa-be

  runner-middle:
    <<: *runner
    deploy:
      replicas: ${LOCAL_RUNNERS_PER_REPO:-1}
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/middle-core
      RUNNER_NAME_PREFIX: aa-mid

volumes:
  # Persists on the host (Docker-managed); shared by every runner replica so the
  # expensive package downloads survive the one-job-then-die ephemeral lifecycle.
  # Clear it any time with: docker volume rm agentarmy-runners_runner-caches
  runner-caches:
