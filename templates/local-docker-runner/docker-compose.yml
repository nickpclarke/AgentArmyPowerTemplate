# Local self-hosted GitHub Actions runners for the AgentArmy fleet.
#
# Free, unmetered CI on your own machine — self-hosted runner minutes do NOT count
# against your monthly GitHub-hosted quota. One persistent Linux runner per private repo.
#
# Prereqs: Docker Desktop running. A classic GitHub PAT with `repo` scope (private repos).
#
# Start:
#   export GH_PAT=ghp_xxx          # do NOT commit; or copy .env.example -> .env
#   docker compose up -d
#   docker compose logs -f         # watch them register
#
# Stop / remove:
#   docker compose down            # de-registers cleanly on graceful stop
#
# The runners auto-carry the labels `self-hosted`, `Linux`, `X64`, so workflows that
# say `runs-on: [self-hosted, linux]` route here. They run only while this machine is on.
name: agentarmy-runners

x-runner: &runner
  image: myoung34/github-runner:latest
  restart: unless-stopped
  environment: &runner-env
    ACCESS_TOKEN: ${GH_PAT:?set GH_PAT in your shell or .env (classic PAT, repo scope)}
    RUNNER_SCOPE: repo
    ORG_NAME: ""
    # `docker-local` routes docker-build jobs here (ACA can't do Docker — no DIND).
    LABELS: agentarmy,local,docker-local
    DISABLE_AUTO_UPDATE: "true"
    # setup-dotnet installs here (writable) instead of root-only /usr/share/dotnet.
    DOTNET_INSTALL_DIR: /home/runner/.dotnet
  security_opt:
    - no-new-privileges:true
  # Mount the host's Docker socket (Docker-out-of-Docker) so `docker build` in a job
  # uses your Docker Desktop daemon. NOTE: this grants jobs host-daemon (root-equivalent)
  # access — acceptable only for PRIVATE repos with your own agents; never for public repos.
  # The work dir stays on the container's normal (exec-able) fs — NOT a tmpfs: setup-python
  # installs a binary there and a noexec tmpfs breaks it ("failed to map segment").
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock

services:
  runner-hub:
    <<: *runner
    container_name: aa-runner-hub
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/AgentArmy
      RUNNER_NAME: aa-local-hub

  runner-frontend:
    <<: *runner
    container_name: aa-runner-frontend
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/frontend-core
      RUNNER_NAME: aa-local-frontend

  runner-backend:
    <<: *runner
    container_name: aa-runner-backend
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/backend-core
      RUNNER_NAME: aa-local-backend

  runner-middle:
    <<: *runner
    container_name: aa-runner-middle
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/nickpclarke/middle-core
      RUNNER_NAME: aa-local-middle
