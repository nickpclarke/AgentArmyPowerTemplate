name: Local Docker Gate To Dev

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to validate and promote."
        required: false
        default: "main"
        type: string
      dev_branch:
        description: "Dev source branch consumed by the cloud build lane."
        required: false
        default: "dev"
        type: string
      cli_test_command:
        description: "Optional service CLI test command."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  local-docker-gate:
    runs-on: [self-hosted, docker-local]
    environment: local-docker
    timeout-minutes: 30
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      DEV_BRANCH: ${{ inputs.dev_branch }}
      CLI_TEST_COMMAND: ${{ inputs.cli_test_command }}
      COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}-gate-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run diagnostics
        shell: powershell
        run: node tools/agentarmy-doctor.mjs --write-artifacts --format markdown --output tests/artifacts/doctor/summary.md

      - name: Build local Docker image
        shell: powershell
        run: docker build --pull --tag "${{ github.event.repository.name }}:local-gate-${{ github.run_id }}" .

      - name: Run optional CLI tests
        if: ${{ inputs.cli_test_command != '' }}
        shell: powershell
        run: Invoke-Expression "$env:CLI_TEST_COMMAND"

      - name: Promote Dev source branch
        shell: powershell
        run: |
          git config user.name "agentarmy-local-docker-gate"
          git config user.email "agentarmy-local-docker-gate@users.noreply.github.com"
          git fetch origin "$env:DEV_BRANCH" --depth=1 2>$null
          git branch --force "$env:DEV_BRANCH" HEAD
          git push origin "$env:DEV_BRANCH" --force-with-lease
