# Example local compose for the AgentArmy jwt-introspect sidecar.
#
# In production this image runs in the same pod / network namespace as a
# spoke (sidecar pattern per ADR-002), and the spoke calls 127.0.0.1:8084/
# introspect. For local development + doctor runs we expose 8084 on the host
# so the test rig can hit it directly, and we wire host.docker.internal so
# the container can fetch the doctor's locally-hosted JWKS document.
services:
  jwt-introspect:
    container_name: jwt-introspect
    build: ..
    image: agentarmy-jwt-introspect:local
    environment:
      # The doctor brings up a small python http.server on the host that
      # publishes the test JWKS. Override JWKS_URL for production to point
      # at your IdP (e.g. https://login.example.com/.well-known/jwks.json).
      JWKS_URL: ${JWKS_URL:-http://host.docker.internal:8085/jwks.json}
      JWKS_TTL_SECONDS: ${JWKS_TTL_SECONDS:-300}
      JWT_ISSUER: ${JWT_ISSUER:-https://doctor.agentarmy.local/}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-agentarmy-spokes}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-RS256,ES256}
      INTROSPECT_PORT: "8084"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8084:8084"
    # Make host.docker.internal resolve on Linux (Docker Desktop already
    # provides it natively on Mac/Windows). The doctor's JWKS server binds
    # to 0.0.0.0:8085 on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /livez is cheap + safe — doesn't require JWKS to be reachable. /readyz
      # gates traffic on JWKS reachability separately.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/livez >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
