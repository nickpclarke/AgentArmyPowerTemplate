# Example local compose for the AgentArmy otel-collector image.
#
# Defaults to standalone mode with the file exporter writing to a
# host-mounted directory so the doctor can inspect spans without
# `docker exec`. Switch to sidecar mode via OTELCOL_MODE=sidecar.

services:
  otel-collector:
    container_name: otel-collector
    build: ..
    image: agentarmy-otel-collector:local
    environment:
      OTELCOL_MODE: ${OTELCOL_MODE:-standalone}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-file}
      OTEL_FILE_PATH: /var/log/otel/spans.jsonl
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_TAIL_SAMPLE_PCT: ${OTEL_TAIL_SAMPLE_PCT:-100}
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus self-metrics
      - "13133:13133" # health-check
    volumes:
      - ./otel-spans:/var/log/otel
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
