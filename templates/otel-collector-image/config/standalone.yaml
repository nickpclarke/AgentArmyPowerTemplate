# OTel Collector standalone (fleet) config — terminal collector.
#
# Standalone mode: the fleet's single aggregation collector that every
# spoke's sidecar forwards into. Applies tail sampling for cost control,
# then exports to the configured backend.
#
# Config variables (env-substituted at startup):
#   OTEL_EXPORTER         — which backend to use. One of: file (default), tempo, honeycomb.
#   OTEL_EXPORTER_ENDPOINT — backend endpoint (gRPC for tempo, HTTPS for honeycomb).
#   OTEL_HONEYCOMB_KEY     — Honeycomb API key. Required only when OTEL_EXPORTER=honeycomb.
#   OTEL_TAIL_SAMPLE_PCT   — sample percentage 0–100; default 100 (keep everything).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch first so downstream cost is bounded.
  batch:
    timeout: 5s
    send_batch_size: 8192
    send_batch_max_size: 10240

  # Tail sampling — decide AFTER seeing the whole trace whether to keep it.
  # Two policies: always keep traces that contain an error, then sample the
  # rest at OTEL_TAIL_SAMPLE_PCT. The collector's env substitution does NOT
  # support shell-style :-defaults, so OTEL_TAIL_SAMPLE_PCT MUST be set in
  # the runtime env (compose / k8s); the example compose sets it to 100.
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: probabilistic-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:OTEL_TAIL_SAMPLE_PCT}

  # Tag every span with the fleet/region/env so multi-region aggregation
  # stays sortable in the backend. OTEL_ENVIRONMENT MUST be set at runtime.
  resource/standalone:
    attributes:
      - key: telemetry.sdk.collector.mode
        value: standalone
        action: upsert
      - key: deployment.environment
        value: ${env:OTEL_ENVIRONMENT}
        action: upsert

exporters:
  # Default exporter — writes spans to a local file. Useful for the doctor
  # script and for local development without provisioning a real backend.
  # For Tempo / Honeycomb / OTLP-gRPC backends, override this section via
  # config file mount or extend the baked config — the collector's env
  # substitution does NOT support shell-style default values, so we can't
  # ship optional-endpoint blocks here. See README.md "Switching exporters".
  file:
    path: /var/log/otel/spans.jsonl
    rotation:
      max_megabytes: 100
      max_days: 3
      max_backups: 5
    format: json

  # Always-on for local debugging.
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    # NOTE: when OTEL_EXPORTER != file, swap the exporter via a config patch
    # (entrypoint.sh handles this; tail_sampling stays in place either way).
    traces:
      receivers: [otlp]
      processors: [batch, tail_sampling, resource/standalone]
      exporters: [file, debug]
    metrics:
      receivers: [otlp]
      processors: [batch, resource/standalone]
      exporters: [file, debug]
    logs:
      receivers: [otlp]
      processors: [batch, resource/standalone]
      exporters: [file, debug]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
