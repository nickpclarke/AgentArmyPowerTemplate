# Local dev compose for the AgentArmy Fuseki super-image.
# Run via setup.sh / setup.ps1 (bootstraps secrets, builds, waits, runs doctor).
services:
  fuseki:
    build:
      context: ..
    image: agentarmy-fuseki-ontology:local
    environment:
      # Admin password for /$/* endpoints (dev only). Dataset endpoints are open.
      ADMIN_PASSWORD_FILE: /run/secrets/fuseki_admin_password
      DS_NAME: knowledge
    secrets:
      - fuseki_admin_password
    volumes:
      - fuseki-data:/fuseki/databases
      - ./../shapes:/shapes:ro        # bring-your-own SHACL shapes (optional)
      - ./../ontologies:/ontologies:ro # bring-your-own foundational ontologies (optional)
    ports:
      - "3030:3030"     # SPARQL + GSP + Studio
secrets:
  fuseki_admin_password:
    file: ./.secrets/fuseki_admin_password.txt
volumes:
  fuseki-data:
