# Infisical (ARC-ADR-037) — BYO-credentials secrets store, platform tier (ARC-ADR-023).
# Pinned per the Image Standard. Brought up by setup.sh (which generates the gitignored
# .env with freshly-rolled secrets). Backend on host :8333 (container 8080).
name: agentarmy-infisical

services:
  infisical-db:
    image: postgres:14-alpine
    container_name: agentarmy-infisical-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [infisical]

  infisical-redis:
    image: redis:7-alpine
    container_name: agentarmy-infisical-redis
    restart: unless-stopped
    networks: [infisical]

  infisical-backend:
    image: infisical/infisical:v0.160.7
    container_name: agentarmy-infisical-backend
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_started
    env_file: .env
    environment:
      - NODE_ENV=production
    ports:
      - "8333:8080"
    networks: [infisical]

volumes:
  infisical-db-data:

networks:
  infisical:
    name: agentarmy-infisical
