name: spoke artifact intake

# Hub receiver for spoke PM-artifact PRs (spikes / research / ADRs), fired by the synced
# .github/workflows/notify-hub-artifacts.yml in each spoke as a `spoke-artifact` dispatch.
#
# Two phases keyed off the PR lifecycle in client_payload.state:
#   - open  -> add the spoke PR to the hub Project board, set Type + Status=In progress
#              (fires at PR open, including drafts, for live visibility).
#   - merged-> set Status=Done AND harvest the artifact files into docs/spokes/<repo>/...,
#              regenerate the rollup index, and commit to main (Pages republishes).
#
# Untrusted client_payload is read via env / $GITHUB_EVENT_PATH and only ever used as quoted
# shell variables or jq inputs — never interpolated into the run script (Actions injection guidance).

on:
  repository_dispatch:
    types: [spoke-artifact]

permissions:
  contents: write

concurrency:
  group: spoke-artifact-${{ github.event.client_payload.repo }}-${{ github.event.client_payload.number }}

env:
  PROJECT_ID: PVT_kwHOAK2BFM4BYEPx
  STATUS_FIELD_ID: PVTSSF_lAHOAK2BFM4BYEPxzhTMpA8
  TYPE_FIELD_ID: PVTSSF_lAHOAK2BFM4BYEPxzhTNGRY
  STATUS_IN_PROGRESS: 47fc9ee4
  STATUS_DONE: 98236657
  TYPE_SPIKE: a1cff148
  TYPE_DECISION: 9611f4b5

jobs:
  intake:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      P_REPO: ${{ github.event.client_payload.repo }}
      P_NUMBER: ${{ github.event.client_payload.number }}
      P_TITLE: ${{ github.event.client_payload.title }}
      P_URL: ${{ github.event.client_payload.url }}
      P_AUTHOR: ${{ github.event.client_payload.author }}
      P_STATE: ${{ github.event.client_payload.state }}
      P_KIND: ${{ github.event.client_payload.kind }}
      P_SHA: ${{ github.event.client_payload.sha }}
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PROJECT_TOKEN }}
          fetch-depth: 0

      - name: Track on the board (Type + Status)
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "PROJECT_TOKEN not set on the hub — cannot write the board." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # kind -> Type option (research maps to Spike; the board has no Research type).
          case "$P_KIND" in
            decision) TYPE_OPT="$TYPE_DECISION" ;;
            *)        TYPE_OPT="$TYPE_SPIKE" ;;
          esac

          # Add the spoke PR to the board (owner-level project holds cross-repo PRs by URL).
          # Idempotent: re-adding an existing URL is a no-op that still returns the item id.
          gh project item-add 1 --owner nickpclarke --url "$P_URL" >/dev/null 2>&1 || true

          # Resolve the project item id for this PR (reliable post-add lookup).
          OWNER="${P_REPO%%/*}"; NAME="${P_REPO##*/}"
          ITEM_ID="$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){projectItems(first:20){nodes{id project{number}}}}}}' \
            -f owner="$OWNER" -f repo="$NAME" -F pr="$P_NUMBER" \
            --jq '.data.repository.pullRequest.projectItems.nodes[] | select(.project.number==1) | .id' 2>/dev/null | head -n1 || true)"

          if [ -z "$ITEM_ID" ]; then
            echo "Could not resolve board item for ${P_REPO}#${P_NUMBER} — skipping field set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$P_STATE" = "merged" ]; then STATUS_OPT="$STATUS_DONE"; else STATUS_OPT="$STATUS_IN_PROGRESS"; fi

          set_field() {
            gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}' \
              -f p="$PROJECT_ID" -f i="$ITEM_ID" -f f="$1" -f o="$2" >/dev/null
          }
          set_field "$TYPE_FIELD_ID" "$TYPE_OPT"
          set_field "$STATUS_FIELD_ID" "$STATUS_OPT"
          echo "Board: ${P_REPO}#${P_NUMBER} -> Type=${P_KIND} Status=${P_STATE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Harvest artifact files into hub docs (merged only)
        if: ${{ github.event.client_payload.state == 'merged' }}
        run: |
          set -euo pipefail
          SPOKE_NAME="${P_REPO##*/}"
          DEST="docs/spokes/${SPOKE_NAME}"

          # Shallow-clone the spoke at the merge commit (PROJECT_TOKEN can read private spokes).
          rm -rf _spoke_src
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${P_REPO}.git" _spoke_src
          if [ -n "${P_SHA:-}" ]; then
            ( cd _spoke_src && git fetch --depth 1 origin "$P_SHA" >/dev/null 2>&1 && git checkout -q "$P_SHA" ) || echo "merge SHA not fetchable; using default branch tip"
          fi

          # Copy each reported artifact file, preserving its path under docs/spokes/<repo>/.
          copied=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "_spoke_src/$f" ]; then
              mkdir -p "${DEST}/$(dirname "$f")"
              cp "_spoke_src/$f" "${DEST}/$f"
              copied=$((copied+1))
            fi
          done < <(jq -r '.client_payload.files[]' "$GITHUB_EVENT_PATH")
          rm -rf _spoke_src
          echo "Harvested ${copied} file(s) from ${P_REPO}#${P_NUMBER} into ${DEST}/" >> "$GITHUB_STEP_SUMMARY"

          # Record provenance for the index generator.
          mkdir -p "$DEST"
          jq -n --arg repo "$P_REPO" --arg number "$P_NUMBER" --arg title "$P_TITLE" \
                --arg url "$P_URL" --arg author "$P_AUTHOR" --arg kind "$P_KIND" \
                --arg date "$(date -u +%Y-%m-%d)" \
                '{repo:$repo, number:$number, title:$title, url:$url, author:$author, kind:$kind, date:$date}' \
            > "${DEST}/.harvest-${P_NUMBER}.json"

          python scripts/gen_spoke_index.py

          if [ -z "$(git status --porcelain docs/spokes)" ]; then
            echo "No doc changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "spoke-artifact-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/spokes
          git commit -m "harvest: ${P_REPO}#${P_NUMBER} ${P_KIND} artifact(s)"
          git push origin HEAD:main
          echo "Committed harvested docs to main — Pages will rebuild." >> "$GITHUB_STEP_SUMMARY"
