name: PI Progress Report

on:
  schedule:
    - cron: '0 8 * * 5'  # Fridays at 08:00 UTC
  workflow_dispatch:

# Report authenticates with PROJECT_TOKEN (Projects v2 reads) and writes only to the
# step summary; the ambient GITHUB_TOKEN needs nothing, so lock it to a read-only floor.
permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_AUTOMATION_ENABLED: ${{ vars.PROJECT_AUTOMATION_ENABLED }}
    steps:
      - name: Report disabled project automation
        if: ${{ env.PROJECT_AUTOMATION_ENABLED != 'true' }}
        run: echo 'Optional project-board automation is disabled. Set PROJECT_AUTOMATION_ENABLED=true and configure PROJECT_TOKEN to enable it.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require token when project automation is enabled
        if: ${{ env.PROJECT_AUTOMATION_ENABLED == 'true' && env.PROJECT_TOKEN == '' }}
        run: |
          echo "::error::PROJECT_AUTOMATION_ENABLED=true requires PROJECT_TOKEN."
          exit 1
      - name: Generate PI progress report
        if: ${{ env.PROJECT_AUTOMATION_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
        run: |
          set -euo pipefail
          ITEMS_JSON=$(gh project item-list "$PROJECT_NUMBER" --owner "$OWNER" --format json --limit 500)

          # Status names below MUST match the board's Status single-select option
          # names exactly (case-sensitive).
          # Verify with: gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json
          TODO=$(echo "$ITEMS_JSON"        | jq '[.items[] | select(.status == "Todo")]              | length')
          READY=$(echo "$ITEMS_JSON"       | jq '[.items[] | select(.status == "Ready")]             | length')
          IN_PROGRESS=$(echo "$ITEMS_JSON" | jq '[.items[] | select(.status == "In Progress")]       | length')
          IN_REVIEW=$(echo "$ITEMS_JSON"   | jq '[.items[] | select(.status == "In Review")]         | length')
          AWAITING=$(echo "$ITEMS_JSON"    | jq '[.items[] | select(.status == "Awaiting Decision")] | length')
          DONE=$(echo "$ITEMS_JSON"        | jq '[.items[] | select(.status == "Done")]              | length')
          TOTAL=$(echo "$ITEMS_JSON"       | jq '.totalCount // (.items | length)')

          if [[ "$TOTAL" -gt 0 ]]; then
            TODO_PCT=$(( TODO        * 100 / TOTAL ))
            READY_PCT=$(( READY      * 100 / TOTAL ))
            IP_PCT=$(( IN_PROGRESS   * 100 / TOTAL ))
            REVIEW_PCT=$(( IN_REVIEW * 100 / TOTAL ))
            AWAIT_PCT=$(( AWAITING   * 100 / TOTAL ))
            DONE_PCT=$(( DONE        * 100 / TOTAL ))
          else
            TODO_PCT=0; READY_PCT=0; IP_PCT=0; REVIEW_PCT=0; AWAIT_PCT=0; DONE_PCT=0
          fi

          {
            echo "# PI Progress Report — $(date '+%Y-%m-%d')"
            echo ""
            echo "| Status | Count | % |"
            echo "|--------|------:|--:|"
            echo "| Todo | $TODO | ${TODO_PCT}% |"
            echo "| Ready | $READY | ${READY_PCT}% |"
            echo "| In Progress | $IN_PROGRESS | ${IP_PCT}% |"
            echo "| In Review | $IN_REVIEW | ${REVIEW_PCT}% |"
            echo "| Done | $DONE | ${DONE_PCT}% |"
            echo "| Awaiting Decision | $AWAITING | ${AWAIT_PCT}% |"
            echo "| **Total** | **$TOTAL** | |"
            echo ""
            echo "**Overall completion: ${DONE_PCT}%**"
          } >> "$GITHUB_STEP_SUMMARY"
