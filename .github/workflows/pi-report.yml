name: PI Progress Report

on:
  schedule:
    - cron: '0 8 * * 5'  # Fridays at 08:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PI progress report
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          ITEMS_JSON=$(gh project item-list 1 --owner nickpclarke --format json --limit 200)

          TODO=$(echo "$ITEMS_JSON"        | jq '[.items[] | select(.status == "Todo")]        | length')
          IN_PROGRESS=$(echo "$ITEMS_JSON" | jq '[.items[] | select(.status == "In progress")] | length')
          DONE=$(echo "$ITEMS_JSON"        | jq '[.items[] | select(.status == "Done")]        | length')
          TOTAL=$(echo "$ITEMS_JSON"       | jq '.totalCount')

          if [[ "$TOTAL" -gt 0 ]]; then
            TODO_PCT=$(( TODO        * 100 / TOTAL ))
            IP_PCT=$(( IN_PROGRESS   * 100 / TOTAL ))
            DONE_PCT=$(( DONE        * 100 / TOTAL ))
          else
            TODO_PCT=0; IP_PCT=0; DONE_PCT=0
          fi

          {
            echo "# PI Progress Report — $(date '+%Y-%m-%d')"
            echo ""
            echo "| Status | Count | % |"
            echo "|--------|------:|--:|"
            echo "| Todo | $TODO | ${TODO_PCT}% |"
            echo "| In Progress | $IN_PROGRESS | ${IP_PCT}% |"
            echo "| Done | $DONE | ${DONE_PCT}% |"
            echo "| **Total** | **$TOTAL** | |"
            echo ""
            echo "**Overall completion: ${DONE_PCT}%**"
          } >> "$GITHUB_STEP_SUMMARY"
