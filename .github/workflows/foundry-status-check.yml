name: Foundry Status Check

# Authenticated health check for the Microsoft Foundry (Azure AI Foundry) resource.
# Runs in GitHub Actions because FOUNDRY_API_KEY is a repo Actions secret and is only
# injected on the runner — it is never exposed to the Claude Code web environment.
# The job lists model deployments via the api-key data-plane call and reports status;
# it never prints the secret value.

on:
  workflow_dispatch:
    inputs:
      resource:
        description: "Foundry resource name (host prefix)"
        required: false
        default: "fndry-01"
      api_version:
        description: "Data-plane api-version"
        required: false
        default: "2024-10-21"
  push:
    branches: [ "claude/microsoft-foundry-activation-XNnVL" ]
    paths: [ ".github/workflows/foundry-status-check.yml" ]

permissions:
  contents: read

jobs:
  foundry-status:
    runs-on: ubuntu-latest
    name: Check Foundry reachability + credentials
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe Foundry data-plane with API key
        env:
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_RESOURCE: ${{ github.event.inputs.resource || 'fndry-01' }}
          FOUNDRY_PROJECT: "proj-default"
          FOUNDRY_API_VERSION: ${{ github.event.inputs.api_version || '2024-10-21' }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.error

          key = os.environ.get("FOUNDRY_API_KEY", "").strip()
          resource = os.environ.get("FOUNDRY_RESOURCE", "fndry-01").strip()
          project = os.environ.get("FOUNDRY_PROJECT", "proj-default").strip()
          api_version = os.environ.get("FOUNDRY_API_VERSION", "2024-10-21").strip()

          lines = []
          def out(s):
              print(s)
              lines.append(s)

          out("## Microsoft Foundry status check")
          out("")
          out(f"- Resource: `{resource}`")
          out(f"- Project: `{project}`")
          out(f"- api-version: `{api_version}`")
          out("")

          def flush(code):
              sp = os.environ.get("GITHUB_STEP_SUMMARY")
              if sp:
                  with open(sp, "a") as f:
                      f.write("\n".join(lines) + "\n")
              sys.exit(code)

          if not key:
              out("**RESULT: FAIL** — `FOUNDRY_API_KEY` secret is empty / not available to this workflow.")
              out("Confirm the secret exists under Settings → Secrets and variables → **Actions** with that exact name.")
              flush(1)

          bases = [
              f"https://{resource}.cognitiveservices.azure.com",
              f"https://{resource}.services.ai.azure.com",
              f"https://{resource}.openai.azure.com",
          ]
          paths = [
              f"/openai/deployments?api-version={api_version}",
              f"/openai/models?api-version={api_version}",
          ]

          ok = False
          for base in bases:
              for path in paths:
                  url = base + path
                  req = urllib.request.Request(url, headers={"api-key": key})
                  try:
                      with urllib.request.urlopen(req, timeout=20) as resp:
                          body = resp.read().decode("utf-8", "replace")
                          code = resp.status
                      try:
                          data = json.loads(body)
                          items = data.get("data") or data.get("value") or []
                          names = sorted({(d.get("id") or d.get("model") or d.get("name") or "") for d in items if isinstance(d, dict)})
                          names = [n for n in names if n]
                          detail = (", ".join(names) if names else "(empty list)")
                      except Exception:
                          detail = "(non-JSON body)"
                      out(f"- ✅ `{url}` → HTTP {code} — {detail}")
                      ok = True
                  except urllib.error.HTTPError as e:
                      out(f"- ❌ `{url}` → HTTP {e.code} ({e.reason})")
                  except Exception as e:
                      out(f"- ⚠️ `{url}` → {type(e).__name__}: {str(e)[:140]}")
              if ok:
                  break

          out("")
          if ok:
              out("**RESULT: PASS** — API key is valid and Foundry is reachable; deployments listed above.")
              flush(0)
          else:
              out("**RESULT: FAIL** — no endpoint returned 2xx with this key.")
              out("HTTP 401 ⇒ key invalid/rotated; HTTP 403 ⇒ key valid but listing forbidden (try Entra); DNS error ⇒ wrong resource name.")
              flush(1)
          PY
