name: ADR Number Guard

# Backstop for accidental hand-numbering: fails a PR if two decision files share
# an ARC-ADR-NNN prefix. The real fix is the DRAFT convention + merge-time
# assigner (adr-assign-numbers.yml); see docs/decisions/README.md.

on:
  pull_request:
    paths:
      - 'docs/decisions/**'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check for duplicate ARC-ADR numbers
        run: node tools/adr-numbers.mjs check
