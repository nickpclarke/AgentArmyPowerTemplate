name: Label PR by size

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write          # create labels (labels live under the issues API)
  pull-requests: write   # add/remove labels on the PR

jobs:
  label-size:
    # Runs on the self-hosted runners (free, off the GitHub-hosted minutes cap).
    # Uses actions/github-script (octokit + GITHUB_TOKEN) — no `gh` CLI dependency,
    # so it works on any runner image without extra tooling.
    runs-on: [self-hosted, linux]
    steps:
      - name: Apply size + deep-review labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changes = (pr.additions || 0) + (pr.deletions || 0);
            const size =
              changes <= 10  ? 'XS' :
              changes <= 50  ? 'S'  :
              changes <= 200 ? 'M'  :
              changes <= 500 ? 'L'  : 'XL';
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            const defs = {
              XS: ['0e8a16', 'PR size: XS (≤10 lines)'],
              S:  ['94d82d', 'PR size: S (≤50 lines)'],
              M:  ['f9c74f', 'PR size: M (≤200 lines)'],
              L:  ['f3722c', 'PR size: L (≤500 lines)'],
              XL: ['d62828', 'PR size: XL (>500 lines)'],
              'needs-deep-review': ['e11d48', 'Large PR — trigger Claude Code deep review via /review-pr'],
            };
            for (const [name, [color, description]] of Object.entries(defs)) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (e) {
                if (e.status !== 422) throw e; // 422 = label already exists
              }
            }

            for (const stale of ['XS', 'S', 'M', 'L', 'XL']) {
              if (stale === size) continue;
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: stale });
              } catch (e) {
                if (e.status !== 404) throw e; // 404 = label wasn't applied
              }
            }

            const labels = [size];
            if (changes > 200) labels.push('needs-deep-review'); // never auto-removed
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels });
            core.info(`PR #${issue_number}: ${changes} changed lines -> ${size}`);
