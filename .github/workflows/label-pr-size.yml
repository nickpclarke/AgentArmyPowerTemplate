name: Label PR by size

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege: PR labels live under the Issues API (a PR is a special issue),
# so `issues: write` covers every call here. `contents`/`pull-requests` are NOT
# needed — github-script doesn't check out the repo, and label ops aren't on the
# pulls endpoint. All other scopes default to `none`.
permissions:
  issues: write

jobs:
  label-size:
    # Uses github-script (octokit + GITHUB_TOKEN) and no repo checkout, so keep
    # the PR gate on GitHub-hosted runners instead of waiting for local capacity.
    runs-on: ubuntu-latest
    steps:
      - name: Apply size + deep-review labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changes = (pr.additions || 0) + (pr.deletions || 0);
            const size =
              changes <= 10  ? 'XS' :
              changes <= 50  ? 'S'  :
              changes <= 200 ? 'M'  :
              changes <= 500 ? 'L'  : 'XL';
            const { owner, repo } = context.repo;
            const issue_number = pr.number;

            // Labeling is best-effort and MUST NOT fail the workflow. The old
            // `gh ... || true` chain guarded this; the github-script rewrite has
            // to do it explicitly. Common non-bug failure modes the labeler must
            // tolerate:
            //   • read-only GITHUB_TOKEN on fork PRs / restricted contexts → 403
            //   • rate-limit / 5xx during a labels API hiccup
            //   • label-write races (concurrent runs)
            // We log a warning so anomalies are still visible in the run log,
            // but a labeling problem must never red the PR check.
            const safe = async (what, fn) => {
              try { return await fn(); }
              catch (e) {
                core.warning(`label op '${what}' skipped (${e.status || '?'}): ${e.message}`);
                return null;
              }
            };

            // Ensure each label exists with current color/description. The old
            // workflow used `gh label create --force`, which UPDATES on conflict;
            // mirror that here so colors don't drift if defs change.
            const defs = {
              XS: ['0e8a16', 'PR size: XS (≤10 lines)'],
              S:  ['94d82d', 'PR size: S (≤50 lines)'],
              M:  ['f9c74f', 'PR size: M (≤200 lines)'],
              L:  ['f3722c', 'PR size: L (≤500 lines)'],
              XL: ['d62828', 'PR size: XL (>500 lines)'],
              'needs-deep-review': ['e11d48', 'Large PR — trigger deep review with Claude Code or a specialist reviewer'],
            };
            for (const [name, [color, description]] of Object.entries(defs)) {
              await safe(`upsert ${name}`, async () => {
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } catch (e) {
                  if (e.status === 422) {
                    // already exists → update to keep color/description current
                    await github.rest.issues.updateLabel({ owner, repo, name, color, description });
                  } else {
                    throw e; // bubble to safe() → warning, never throw
                  }
                }
              });
            }

            // Remove stale size labels. 404 = label wasn't applied → silently OK.
            for (const stale of ['XS', 'S', 'M', 'L', 'XL']) {
              if (stale === size) continue;
              await safe(`remove ${stale}`, async () => {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name: stale });
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
              });
            }

            const labels = [size];
            if (changes > 200) labels.push('needs-deep-review'); // never auto-removed
            await safe(`add ${labels.join(',')}`,
              () => github.rest.issues.addLabels({ owner, repo, issue_number, labels })
            );
            core.info(`PR #${issue_number}: ${changes} changed lines -> ${size}`);
