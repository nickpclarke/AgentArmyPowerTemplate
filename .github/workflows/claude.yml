name: Claude

# The @claude responder. Reacts to @claude mentions in issue/PR comments,
# review comments, reviews, and issues. Also handles the aggregated @claude
# comments posted by review-loop.yml (the autonomous review-fix loop).
#
# Auth:
#   - claude_code_oauth_token: Claude subscription token (secret CLAUDE_CODE_OAUTH_TOKEN)
#   - github_token: PROJECT_TOKEN (classic PAT) so Claude's pushes RE-TRIGGER the
#     review bots (a push made with the default GITHUB_TOKEN does not trigger other
#     workflows — this is what closes the review loop).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Cheap pre-filter so the action only spins up when @claude is actually present.
    # The action also enforces its own trigger_phrase + write-permission checks.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT (not GITHUB_TOKEN) so fix-pushes re-trigger Gemini/Copilot reviews.
          github_token: ${{ secrets.PROJECT_TOKEN }}
          # trigger_phrase defaults to "@claude".
