name: Claude

# The @claude responder. Reacts to @claude mentions in issue/PR comments,
# review comments, reviews, and issues. Also handles the aggregated @claude
# comments posted by review-loop.yml (the autonomous review-fix loop).
#
# Auth:
#   - claude_code_oauth_token: Claude subscription token (secret CLAUDE_CODE_OAUTH_TOKEN)
#   - github_token: PROJECT_TOKEN (classic PAT) so Claude's pushes RE-TRIGGER the
#     review bots (a push made with the default GITHUB_TOKEN does not trigger other
#     workflows — this is what closes the review loop).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Cheap pre-filter so the action only spins up when @claude is actually present.
    # The action also enforces its own trigger_phrase + write-permission checks.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Untool fleet suite — let the cloud microVM reach the operator's local docker
    # via mcp.untool.ai (CF Access edge enforcement). The .mcp.json in the repo
    # substitutes these env vars when the MCP client starts; CF Access then
    # authenticates the call at the edge. Empty env = no fleet access (the MCP
    # connection just fails closed; @claude still works for everything else).
    #
    # Provision once per repo:
    #   gh secret set LOCAL_FLEET_MCP_URL     --body "https://mcp.untool.ai/mcp"
    #   gh secret set CF_ACCESS_CLIENT_ID     --body "<id-from-CF-dashboard>"
    #   gh secret set CF_ACCESS_CLIENT_SECRET --body "<secret-from-CF-dashboard>"
    # See obsidian/labs/AgentArmyLabs/Untool Fleet Suite — Operating Manual.md
    env:
      LOCAL_FLEET_MCP_URL:     ${{ secrets.LOCAL_FLEET_MCP_URL }}
      CF_ACCESS_CLIENT_ID:     ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT (not GITHUB_TOKEN) so fix-pushes re-trigger Gemini/Copilot reviews.
          github_token: ${{ secrets.PROJECT_TOKEN }}
          # trigger_phrase defaults to "@claude".
