name: Stale issues and PRs

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays at 09:00 UTC
  workflow_dispatch:

# Least-privilege scopes for the built-in GITHUB_TOKEN, so this workflow does
# not depend on the repo-wide "Read and write" Actions setting.
permissions:
  contents: read
  issues: write          # actions/stale labels & closes stale issues
  pull-requests: write   # actions/stale labels & closes stale PRs

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue has had no activity for 14 days and will be closed in 7 days
            unless there is further activity. If still relevant, please comment or
            remove the stale label.
          close-issue-message: Closed due to inactivity. Reopen if still relevant.
          stale-pr-message: >
            This PR has had no activity for 14 days and will be closed in 7 days
            unless there is further activity.
          close-pr-message: Closed due to inactivity. Reopen if still relevant.
          exempt-issue-labels: 'pinned,security,P0,Epic'
          exempt-pr-labels: 'pinned,security'
