name: Validate agents & docs

on:
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".codex/**"
      - ".agents/**"
      - "scripts/**"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements-docs.txt pyyaml

      - name: Validate agent definitions
        run: python scripts/validate_agents.py

      - name: Generate agent docs
        run: python scripts/generate_agent_docs.py

      - name: Generate subagent roster
        run: python scripts/generate_subagent_roster.py

      - name: Sync Codex agents
        run: python scripts/sync_agents_to_codex.py

      - name: Sync Antigravity plugins
        run: python scripts/sync_agents_to_antigravity.py

      - name: Generate abbreviations
        run: node tools/acronyms.mjs abbr

      - name: Build docs
        run: python -m mkdocs build

      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet -- docs/agents-glossary/index.md .agent/subagent-roster.md .codex/agents .agents/plugins docs/includes/abbreviations.md; then
            echo "::error::Generated files are stale. Run the generation commands locally and commit the results."
            git diff -- docs/agents-glossary/index.md .agent/subagent-roster.md .codex/agents .agents/plugins docs/includes/abbreviations.md
            exit 1
          fi
