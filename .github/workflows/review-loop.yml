name: Autonomous review loop

# Orchestrates the Claude <-> review-bot fix loop on a PR.
#
# Opt-in: add the `review-loop` label to a PR. The loop then runs on every bot
# review until the PR is clean (review-loop:done) or it hits the round cap
# (review-loop:escalated -> a HITL Decision artifact).
#
# This workflow is the BRAIN (decides whether to iterate, tracks rounds,
# checks convergence, escalates). It does NOT edit code — it posts one
# aggregated `@claude` comment, which triggers claude.yml (the HANDS).
#
# It authenticates with PROJECT_TOKEN (classic PAT) for two reasons:
#   1. the `@claude` comment must be posted by a PAT so it re-triggers claude.yml
#      (a comment posted with GITHUB_TOKEN does not trigger other workflows);
#   2. board/issue writes need the PAT.

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: review-loop-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review-loop:
    runs-on: ubuntu-latest
    # Only when the PR carries the `review-loop` label, and only for a review
    # event or the moment the label itself is added (ignore unrelated label edits).
    if: |
      contains(toJson(github.event.pull_request.labels), '"review-loop"') &&
      (github.event_name == 'pull_request_review' || github.event.label.name == 'review-loop')
    steps:
      - name: Ensure loop labels exist
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "review-loop"           --color "1f6feb" --description "Run the autonomous Claude review-fix loop on this PR" --force
          gh label create "review-loop:done"      --color "0e8a16" --description "Review loop converged — no actionable bot comments remain" --force
          gh label create "review-loop:escalated" --color "e11d48" --description "Review loop hit the round cap — Decision artifact opened" --force

      - name: Run review loop
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FULL_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR_NUM: ${{ github.event.pull_request.number }}
          MAX_ROUNDS: ${{ vars.REVIEW_LOOP_MAX_ROUNDS || '3' }}
          BOT_LOGINS: "gemini-code-assist[bot],copilot-pull-request-reviewer[bot],chatgpt-codex-connector[bot]"
        run: |
          cat > /tmp/review_loop.py << 'PYEOF'
          import os, json, subprocess, re, sys
          from datetime import datetime

          REPO       = os.environ['FULL_REPO']
          PR_NUM     = os.environ['PR_NUM']
          MAX_ROUNDS = int(os.environ.get('MAX_ROUNDS', '3'))
          BOTS       = set(b.strip() for b in os.environ['BOT_LOGINS'].split(',') if b.strip())
          MARKER_RE  = re.compile(r'<!--\s*review-loop round=(\d+)\s*-->')

          def gh_json(args):
              r = subprocess.run(['gh'] + args, capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"WARN gh {' '.join(args)}: {r.stderr.strip()}", file=sys.stderr)
                  return None
              try:
                  return json.loads(r.stdout) if r.stdout.strip() else None
              except json.JSONDecodeError:
                  return None

          def gh_run(args):
              r = subprocess.run(['gh'] + args, capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"WARN gh {' '.join(args)}: {r.stderr.strip()}", file=sys.stderr)
              return r.returncode == 0

          def ts(s):
              return datetime.fromisoformat(s.replace('Z', '+00:00'))

          def post(body):
              subprocess.run(['gh', 'issue', 'comment', PR_NUM, '--repo', REPO, '--body', body],
                             capture_output=True, text=True)

          # -- Gather state -------------------------------------------
          issue_comments  = gh_json(['api', f'repos/{REPO}/issues/{PR_NUM}/comments', '--paginate']) or []
          commits         = gh_json(['api', f'repos/{REPO}/pulls/{PR_NUM}/commits',  '--paginate']) or []
          reviews         = gh_json(['api', f'repos/{REPO}/pulls/{PR_NUM}/reviews',  '--paginate']) or []
          review_comments = gh_json(['api', f'repos/{REPO}/pulls/{PR_NUM}/comments', '--paginate']) or []

          last_commit_ts = ts(commits[-1]['commit']['committer']['date']) if commits else None

          rounds, latest_marker_ts = [], None
          for c in issue_comments:
              m = MARKER_RE.search(c.get('body', ''))
              if m:
                  rounds.append(int(m.group(1)))
                  t = ts(c['created_at'])
                  if latest_marker_ts is None or t > latest_marker_ts:
                      latest_marker_ts = t
          current_round = max(rounds) if rounds else 0

          # Debounce: if we already asked Claude for the current HEAD commit, wait for the push.
          if latest_marker_ts and last_commit_ts and latest_marker_ts > last_commit_ts:
              print("Already requested a fix for the current HEAD; waiting for Claude's push.")
              sys.exit(0)

          def after(s):
              if last_commit_ts is None:
                  return True
              try:
                  return ts(s) > last_commit_ts
              except Exception:
                  return False

          # -- What's actionable? -------------------------------------
          # Inline comments whose `position` is still set are anchored to the
          # CURRENT diff (not outdated) = unaddressed. This is timestamp-independent,
          # so feedback that lands late on a commit is never dropped, and an
          # unaddressed comment from ANY bot keeps the loop from converging early.
          bot_inline_open = [c for c in review_comments
                             if (c.get('user') or {}).get('login') in BOTS
                             and c.get('position') is not None]

          # A bot's LATEST review state of CHANGES_REQUESTED is actionable,
          # regardless of whether that review carried a body.
          latest_review = {}
          for r in reviews:
              login = (r.get('user') or {}).get('login')
              if login in BOTS and r.get('submitted_at'):
                  if login not in latest_review or r['submitted_at'] > latest_review[login]['submitted_at']:
                      latest_review[login] = r
          changes_requested = [r for r in latest_review.values() if r.get('state') == 'CHANGES_REQUESTED']

          actionable = []
          for c in bot_inline_open:
              loc = f"{c.get('path','')}:{c.get('line') or c.get('original_line') or '?'}"
              actionable.append((c['user']['login'], loc, (c.get('body') or '').strip()))
          for r in changes_requested:
              actionable.append((r['user']['login'], 'review: changes requested',
                                 (r.get('body') or '(no description provided)').strip()))

          # Require fresh eyes on the latest commit before declaring "done":
          # at least one bot must have reviewed/commented after the last commit.
          bot_activity_after = (
              any(after(r['submitted_at']) for r in reviews
                  if (r.get('user') or {}).get('login') in BOTS and r.get('submitted_at'))
              or any(after(c['created_at']) for c in review_comments
                     if (c.get('user') or {}).get('login') in BOTS and c.get('created_at')))

          # -- Decide -------------------------------------------------
          if not actionable:
              if not bot_activity_after:
                  print(f"No bot re-review since last commit; waiting. round={current_round}")
                  sys.exit(0)
              post(":white_check_mark: **Review loop converged** after "
                   f"{current_round} round(s) — the review bots left no actionable comments on the latest commit."
                   "\n\n<!-- review-loop converged -->")
              gh_run(['issue', 'edit', PR_NUM, '--repo', REPO,
                      '--remove-label', 'review-loop', '--add-label', 'review-loop:done'])
              print("Converged.")
              sys.exit(0)

          if current_round >= MAX_ROUNDS:
              pr = gh_json(['api', f'repos/{REPO}/pulls/{PR_NUM}']) or {}
              pr_title = pr.get('title', f'PR #{PR_NUM}')
              digest = "\n".join(
                  f"- **{src}** ({loc}): {(body.splitlines()[0] if body else '')[:160]}"
                  for src, loc, body in actionable[:20])
              decision_lines = [
                  "## Decision Summary",
                  f"The autonomous review-fix loop on PR #{PR_NUM} reached its round cap "
                  f"({MAX_ROUNDS}) without converging. A human needs to decide how to proceed.",
                  "",
                  "## Context",
                  f"Claude and the review bots iterated {current_round} time(s) but outstanding "
                  "bot comments remain. This usually means the feedback is subjective, the bots "
                  "disagree, or the change needs human judgment.",
                  "",
                  "Latest outstanding bot feedback:",
                  digest,
                  "",
                  "## Options",
                  "",
                  "### Option A: Accept current state and merge",
                  "- Pros: unblocks the PR; the remaining comments may be nits",
                  "- Cons: ships against bot advice",
                  "",
                  "### Option B: Take over manually",
                  "- Pros: a human resolves the contested points directly",
                  "- Cons: costs reviewer time",
                  "",
                  "### Option C: Re-scope or close the PR",
                  "- Pros: avoids forcing a low-quality change",
                  "- Cons: work may need redoing",
                  "",
                  "## Agent Recommendation",
                  "No preference — this is exactly the judgment call the loop is designed to escalate.",
                  "",
                  "## Impact of Each Option",
                  f"Determines whether PR #{PR_NUM} merges, is reworked, or is closed.",
                  "",
                  "## Blocks",
                  f"- #{PR_NUM} {pr_title}",
                  "",
                  "## Decision Needed By",
                  "Before this PR is merged.",
                  "",
                  "## How to Decide",
                  "Comment with your choice and any conditions, then close this issue. "
                  f"Closing automatically unblocks PR #{PR_NUM}.",
              ]
              decision_body = "\n".join(decision_lines)
              r = subprocess.run(['gh', 'issue', 'create', '--repo', REPO,
                                  '--title', f'Decision: PR #{PR_NUM} review loop stalled (blocks #{PR_NUM})',
                                  '--body', decision_body,
                                  '--label', 'hitl-decision,assignee:human'],
                                 capture_output=True, text=True)
              url = r.stdout.strip().splitlines()[-1] if (r.returncode == 0 and r.stdout.strip()) else '(issue creation failed — check PROJECT_TOKEN)'
              gh_run(['issue', 'edit', PR_NUM, '--repo', REPO,
                      '--remove-label', 'review-loop', '--add-label', 'review-loop:escalated'])
              post(f":raising_hand: **Review loop escalated** after {MAX_ROUNDS} rounds — "
                   f"opened a Decision artifact for a human: {url}\n\n<!-- review-loop escalated -->")
              print(f"Escalated: {url}")
              sys.exit(0)

          # -- Proceed: ask Claude to address this round's feedback ----
          new_round = current_round + 1
          lines = [f"@claude — Autonomous review loop, round {new_round}/{MAX_ROUNDS}.", "",
                   "The review bots left the feedback below on this PR. Please **address each item "
                   "with minimal, targeted changes**, then commit and push. Reply to the review threads "
                   "where you can. Do not refactor beyond what the comments ask for.", ""]
          by_src = {}
          for src, loc, body in actionable[:30]:
              by_src.setdefault(src, []).append((loc, body))
          for src, items in by_src.items():
              lines.append(f"### From {src}")
              for loc, body in items:
                  head = body.splitlines()[0] if body.strip() else '(no text)'
                  more = ' …' if len(body.strip().splitlines()) > 1 else ''
                  lines.append(f"- `{loc}` — {head}{more}")
              lines.append("")
          if len(actionable) > 30:
              lines.append(f"_…and {len(actionable) - 30} more comment(s) — see the PR threads._\n")
          lines.append(f"<!-- review-loop round={new_round} -->")
          post("\n".join(lines))
          print(f"Posted round {new_round} @claude request with {len(actionable)} item(s).")
          PYEOF
          python3 /tmp/review_loop.py
