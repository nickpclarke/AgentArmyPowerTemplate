name: Sync issue status with PR

on:
  pull_request:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  sync-status:
    runs-on: ubuntu-latest
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_AUTOMATION_ENABLED: ${{ vars.PROJECT_AUTOMATION_ENABLED }}
    steps:
      - name: Report disabled project automation
        if: ${{ env.PROJECT_AUTOMATION_ENABLED != 'true' }}
        run: echo 'Optional project-board automation is disabled. Set PROJECT_AUTOMATION_ENABLED=true and configure PROJECT_TOKEN to enable it.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require token when project automation is enabled
        if: ${{ env.PROJECT_AUTOMATION_ENABLED == 'true' && env.PROJECT_TOKEN == '' }}
        run: |
          echo "::error::PROJECT_AUTOMATION_ENABLED=true requires PROJECT_TOKEN."
          exit 1
      - name: Update linked issue statuses
        if: ${{ env.PROJECT_AUTOMATION_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
        run: |
          set -euo pipefail
          ACTION="${{ github.event.action }}"
          MERGED="${{ github.event.pull_request.merged }}"
          if [[ "$ACTION" == "opened" ]]; then
            TARGET_STATUS="In Progress"
          elif [[ "$ACTION" == "closed" && "$MERGED" == "true" ]]; then
            TARGET_STATUS="Done"
          else
            echo "No status change needed: action=$ACTION merged=$MERGED"
            exit 0
          fi

          ISSUES=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | grep -oiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' | grep -oE '[0-9]+' || true)
          if [[ -z "$ISSUES" ]]; then
            echo "No linked issues found in PR body"
            exit 0
          fi

          PROJECT_JSON=$(gh project view "$PROJECT_NUMBER" --owner "$REPO_OWNER" --format json)
          PROJECT_ID=$(echo "$PROJECT_JSON" | jq -r '.id')
          FIELD_JSON=$(gh project field-list "$PROJECT_NUMBER" --owner "$REPO_OWNER" --format json --limit 100)
          STATUS_FIELD_ID=$(echo "$FIELD_JSON" | jq -r '.fields[] | select(.name == "Status") | .id')
          OPTION_ID=$(echo "$FIELD_JSON" | jq -r --arg name "$TARGET_STATUS" '.fields[] | select(.name == "Status") | .options[]? | select(.name == $name) | .id')

          if [[ -z "$PROJECT_ID" || -z "$STATUS_FIELD_ID" || -z "$OPTION_ID" ]]; then
            echo "::error::Could not resolve project, Status field, or option '$TARGET_STATUS'."
            exit 1
          fi

          for ISSUE_NUM in $ISSUES; do
            ITEM_ID=$(gh api graphql \
              -f query='query($owner: String!, $repo: String!, $issue: Int!, $project: Int!) { repository(owner: $owner, name: $repo) { issue(number: $issue) { projectItems(first: 20) { nodes { id project { number } } } } } }' \
              -f owner="$REPO_OWNER" -f repo="$REPO_NAME" -F issue="$ISSUE_NUM" -F project="$PROJECT_NUMBER" \
              --jq ".data.repository.issue.projectItems.nodes[] | select(.project.number == (${PROJECT_NUMBER} | tonumber)) | .id" 2>/dev/null || true)

            if [[ -z "$ITEM_ID" ]]; then
              echo "Issue #$ISSUE_NUM is not on project $PROJECT_NUMBER; skipping."
              continue
            fi

            gh api graphql \
              -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) { updateProjectV2ItemFieldValue(input: { projectId: $project, itemId: $item, fieldId: $field, value: { singleSelectOptionId: $option } }) { projectV2Item { id } } }' \
              -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$STATUS_FIELD_ID" -f option="$OPTION_ID"
            echo "Updated issue #$ISSUE_NUM to $TARGET_STATUS."
          done
