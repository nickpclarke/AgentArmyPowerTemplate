name: spoke callback

# Hub receiver for spoke -> hub callbacks. A spoke fires a `spoke-update`
# repository_dispatch (see the synced .github/workflows/notify-hub.yml) when it ships work
# (PR merged / issue closed); this records it on the hub so cross-repo activity is visible
# in one place — a "Spoke Activity Log" issue + the run summary.
#
# Untrusted client_payload is read via env vars and used only as quoted shell variables
# (never interpolated into the run script), per GitHub Actions injection guidance.

on:
  repository_dispatch:
    types: [spoke-update]

permissions:
  issues: write
  contents: read

# Serialize callbacks so two near-simultaneous spoke events can't both create the
# tracker issue (which previously produced duplicate "Spoke Activity Log" issues).
concurrency:
  group: spoke-callback

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      P_REPO: ${{ github.event.client_payload.repo }}
      P_KIND: ${{ github.event.client_payload.kind }}
      P_NUMBER: ${{ github.event.client_payload.number }}
      P_TITLE: ${{ github.event.client_payload.title }}
      P_URL: ${{ github.event.client_payload.url }}
      P_AUTHOR: ${{ github.event.client_payload.author }}
      P_SNIPPET: ${{ github.event.client_payload.snippet }}
    steps:
      - name: Record spoke update on the hub
        run: |
          # client_payload is untrusted: a spoke PR/issue/comment title or body can carry
          # @mentions or newlines. Posting it raw into a hub issue comment would spam-mention
          # users/teams and could mangle the markdown line. Neutralize @ (insert a zero-width
          # space, U+200B, after it) and flatten whitespace before composing the log line.
          # $P_NUMBER and $P_URL are controlled github.com values, left intact so the link
          # stays clickable.
          zwsp=$(printf '\342\200\213')
          sanitize() { printf '%s' "$1" | tr '\r\n\t' '   ' | sed "s/@/@${zwsp}/g"; }
          repo=$(sanitize "$P_REPO")
          author=$(sanitize "$P_AUTHOR")
          title=$(sanitize "$P_TITLE")
          snippet=$(sanitize "$P_SNIPPET")
          if [ "$P_KIND" = "comment" ]; then
            line="**$repo** comment by $author on #$P_NUMBER — $snippet ($P_URL)"
          else
            line="**$repo** $P_KIND #$P_NUMBER: $title ($P_URL)"
          fi
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          # Find the tracker by exact title via the REST list (not `--search`, whose index
          # lags behind issue creation and returned empty right after we created the issue).
          tracker=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 \
            --json number,title --jq 'map(select(.title=="Spoke Activity Log"))|.[0].number // empty')
          if [ -z "$tracker" ]; then
            # Read the number straight from the create output rather than re-listing.
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Spoke Activity Log" \
              --body "Auto-updated by the spoke-callback workflow. Each comment is a spoke event reported back to the hub.")
            tracker="${url##*/}"
          fi
          if [ -z "$tracker" ]; then
            echo "::error::Could not resolve the Spoke Activity Log tracker issue number; aborting." >&2
            exit 1
          fi
          gh issue comment "$tracker" --repo "$GITHUB_REPOSITORY" --body "$line"
