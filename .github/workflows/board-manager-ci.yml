name: Board Manager CI

on:
  pull_request:
    paths:
      - "extensions/board-manager/**"
  push:
    branches: [main]
    paths:
      - "extensions/board-manager/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: extensions/board-manager
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extensions/board-manager/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js
