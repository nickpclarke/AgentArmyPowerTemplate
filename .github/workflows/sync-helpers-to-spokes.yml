name: sync helpers to spokes

# One-way sync of the multi-coder agent helper surface (Claude Code, OpenAI Codex,
# Gemini Antigravity packs + shared CONSTITUTION.md/AGENTS.md) from this hub to the
# spoke repos — the "dressing" routine. Opens/updates a PR in each spoke. Source of
# truth is this repo. See docs/spoke-lifecycle.md.
#
# Auth: uses PROJECT_TOKEN (classic PAT, already scoped for this org's repos).
# The built-in GITHUB_TOKEN cannot write to other repositories, so it is NOT used.
# If PROJECT_TOKEN can't yet write to a spoke, grant the token access to that repo.

on:
  workflow_dispatch:
    inputs:
      spoke:
        description: "Single spoke repo name (blank = all spokes in config)"
        required: false
        default: ""
      dry_run:
        description: "Clone + diff only, no push/PR"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    # This list MUST mirror the `paths` array in scripts/spoke_sync.config.json — that JSON is
    # the source of truth for WHAT syncs, but GitHub Actions can't read it at trigger-eval time,
    # so the paths that should TRIGGER a sync are duplicated here by hand. If they drift, an edit
    # to a synced file lands on the hub but never opens spoke sync PRs (the bug #368 fixed).
    # Keep the two lists in lockstep; the last two entries are the sync machinery itself.
    paths:
      - "AGENTS.md"
      - "CONSTITUTION.md"
      - "ontology/platform-self-model/generated/lexicon.yaml"
      - ".agent/hub.json"
      - ".agent/environments.json"
      - ".github/ISSUE_TEMPLATE/epic-handoff.md"
      - ".github/workflows/notify-hub.yml"
      - ".github/workflows/notify-hub-artifacts.yml"
      - ".github/workflows/claude.yml"
      - ".github/workflows/copilot-review.yml"
      - ".github/workflows/review-loop.yml"
      - ".claude/agents/**"
      - ".claude/commands/**"
      - ".claude/agent-schema.json"
      - ".claude/settings.json"
      - ".claude/hooks/setup-dotnet.sh"
      - ".codex/agents/**"
      - ".codex/config.toml"
      - ".codex/hooks.json"
      - ".agents/plugins/**"
      - ".mcp.json"
      - "scripts/mempalace_hook.py"
      - "scripts/mempalace-hook.ps1"
      - "scripts/board_commands.py"
      - "scripts/onboarding-check.ps1"
      - "scripts/sync_agents_to_codex.py"
      - "scripts/sync_agents_to_antigravity.py"
      - "tools/status.mjs"
      - "tools/fleet-heartbeat.mjs"
      - "scripts/spoke_sync.config.json"
      - "scripts/sync_helpers_to_spokes.py"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync helpers to spokes
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          INPUT_SPOKE: ${{ github.event.inputs.spoke }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$INPUT_SPOKE" ]; then ARGS+=(--spoke "$INPUT_SPOKE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python scripts/sync_helpers_to_spokes.py "${ARGS[@]}"
