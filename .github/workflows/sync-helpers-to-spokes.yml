name: sync helpers to spokes

# One-way sync of the Claude Code microVM helper surface (agents, commands,
# settings, hooks scripts) from this hub to the spoke repos. Opens/updates a PR
# in each spoke — never merges automatically. Source of truth is this repo.
#
# Auth: uses PROJECT_TOKEN (classic PAT, already scoped for this org's repos).
# The built-in GITHUB_TOKEN cannot write to other repositories, so it is NOT used.
# If PROJECT_TOKEN can't yet write to a spoke, grant the token access to that repo.

on:
  workflow_dispatch:
    inputs:
      spoke:
        description: "Single spoke repo name (blank = all spokes in config)"
        required: false
        default: ""
      dry_run:
        description: "Clone + diff only, no push/PR"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".claude/agents/**"
      - ".claude/commands/**"
      - ".claude/agent-schema.json"
      - ".claude/settings.json"
      - "scripts/mempalace_hook.py"
      - "scripts/mempalace-hook.ps1"
      - "scripts/board_commands.py"
      - "scripts/onboarding-check.ps1"
      - "tools/status.mjs"
      - "tools/fleet-heartbeat.mjs"
      - "scripts/spoke_sync.config.json"
      - "scripts/sync_helpers_to_spokes.py"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sync helpers to spokes
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          INPUT_SPOKE: ${{ github.event.inputs.spoke }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$INPUT_SPOKE" ]; then ARGS+=(--spoke "$INPUT_SPOKE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python scripts/sync_helpers_to_spokes.py "${ARGS[@]}"
