name: Request Copilot code review

on:
  pull_request:
    types: [opened, ready_for_review]

# Least-privilege GITHUB_TOKEN scopes, so this workflow does not depend on the
# repo-wide "Read and write" Actions setting.
permissions:
  contents: read
  issues: write          # gh label create (repo labels live under the issues API)
  pull-requests: write   # request Copilot reviewer + gh pr edit --add-label

# This workflow has no checkout, so gh resolves the target repo from GH_REPO
# rather than a local git remote.
env:
  GH_REPO: ${{ github.repository }}

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    steps:
      - name: Add Copilot as reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            --method POST \
            --field 'reviewers[]=Copilot'
        # Prerequisites:
        # 1. Enable Copilot code review in repo Settings → Copilot → Code review
        # 2. If "Automatic" mode is on, this workflow is optional (Copilot reviews every PR)
        # 3. If the above fails, set Copilot review to "Automatic" in repo settings instead
        continue-on-error: true

      - name: Label PR for deep review if large
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ADDITIONS=${{ github.event.pull_request.additions }}
          DELETIONS=${{ github.event.pull_request.deletions }}
          CHANGES=$(( ADDITIONS + DELETIONS ))

          # Flag large PRs for Claude Code deep review
          if [ "$CHANGES" -gt 200 ]; then
            gh label create "needs-deep-review" \
              --color "e11d48" \
              --description "Large PR — trigger Claude Code deep review via /review-pr" \
              --force 2>/dev/null || true
            gh pr edit ${{ github.event.pull_request.number }} --add-label "needs-deep-review"
            echo "PR flagged for deep review ($CHANGES lines changed)"
          fi
