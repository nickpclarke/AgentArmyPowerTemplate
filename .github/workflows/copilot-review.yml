name: Request Copilot code review

on:
  pull_request:
    types: [opened, ready_for_review]

# Least-privilege: this workflow only requests a reviewer on the PR.
# (PR-size + needs-deep-review labelling lives in label-pr-size.yml, which also
# runs on `synchronize` so it tracks PRs that grow after they're opened.)
permissions:
  contents: read
  pull-requests: write

jobs:
  request-copilot-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Add Copilot as reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            --method POST \
            --field 'reviewers[]=Copilot'
        # Prerequisites:
        # 1. Enable Copilot code review in repo Settings → Copilot → Code review
        # 2. If "Automatic" mode is on, this is redundant but harmless
        continue-on-error: true
