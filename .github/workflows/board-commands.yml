name: Board slash commands

# Triggered by commenting /board-status, /sprint, /blocked, /p0, /pi PI-1, /board-help
# Works on both issues and pull requests.

on:
  issue_comment:
    types: [created]

# Least-privilege scopes for the built-in GITHUB_TOKEN used by the reaction step.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  board-command:
    runs-on: ubuntu-latest
    if: |
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (
        startsWith(github.event.comment.body, '/board') ||
        startsWith(github.event.comment.body, '/sprint') ||
        startsWith(github.event.comment.body, '/blocked') ||
        startsWith(github.event.comment.body, '/p0') ||
        startsWith(github.event.comment.body, '/pi ') ||
        startsWith(github.event.comment.body, '/decisions')
      )

    steps:
      - uses: actions/checkout@v7

      - name: Acknowledge with reaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -X POST -f content="eyes"

      - name: Run board command
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          CMD: ${{ github.event.comment.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          FULL_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER || '1' }}
        run: python3 scripts/board_commands.py
