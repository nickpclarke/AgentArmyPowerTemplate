name: Route issues to Copilot coding agent

on:
  issues:
    types: [labeled]

# Least-privilege GITHUB_TOKEN scopes, so this workflow does not depend on the
# repo-wide "Read and write" Actions setting. Issues-only trigger; no PR scope.
permissions:
  contents: read
  issues: write   # gh label create, gh issue edit (assignee/labels), gh issue comment

# This workflow has no checkout, so gh resolves the target repo from GH_REPO
# rather than a local git remote.
env:
  GH_REPO: ${{ github.repository }}

jobs:
  route-to-copilot:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'copilot-task'
    steps:
      - name: Ensure copilot-task label exists with description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "copilot-task" \
            --color "0052cc" \
            --description "Delegate to GitHub Copilot coding agent — bounded, well-defined tasks" \
            --force

      - name: Ensure agent-army-task label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "agent-army-task" \
            --color "7c3aed" \
            --description "Delegate to Claude Code AgentArmy — complex, multi-file, architecture-heavy" \
            --force

      - name: Assign issue to Copilot coding agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Assign to Copilot — requires Copilot coding agent enabled for this org/repo
          # Enable at: Settings → Copilot → Coding agent → Enable
          gh issue edit ${{ github.event.issue.number }} \
            --add-assignee "Copilot"
        continue-on-error: true

      - name: Post routing comment with context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SIZE_LABEL=$(gh issue view ${{ github.event.issue.number }} \
            --json labels --jq '[.labels[].name] | map(select(test("^(XS|S|M|L|XL)$"))) | first // "unknown"')

          TYPE_LABEL=$(gh issue view ${{ github.event.issue.number }} \
            --json labels --jq '[.labels[].name] | map(select(test("^(bug|feature|docs|spike|enabler)$"))) | first // "story"')

          ISSUE_BODY=$(gh issue view ${{ github.event.issue.number }} --json body -q '.body')

          gh issue comment ${{ github.event.issue.number }} --body "$(cat <<EOF
          **🤖 Routed to GitHub Copilot Coding Agent**

          **Scope:** Size \`$SIZE_LABEL\` | Type \`$TYPE_LABEL\`

          **Important constraints:**
          - This is a *template repo* — changes are to docs, workflows, or config only (no app code)
          - Max ~50 lines per file
          - Single file or tightly related files
          - If this touches multiple systems → remove \`copilot-task\`, add \`agent-army-task\`

          **What Copilot will do:**
          1. Create a branch from \`main\`
          2. Implement the changes
          3. Open a PR referencing this issue with \`Closes #${{ github.event.issue.number }}\`

          **When the PR opens:**
          - Gemini will auto-review
          - Security scan will run
          - If >200 lines: \`needs-deep-review\` label auto-applied → run \`/review-pr\` in Claude Code

          **See also:** [AI Coordination Guide](.github/AI-COORDINATION.md)

          _To escalate to Claude Code agents, remove \`copilot-task\` and add \`agent-army-task\`._
          EOF
          )"

  route-to-agent-army:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'agent-army-task'
    steps:
      - name: Post routing comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "$(cat <<EOF
          **⚔️ Routed to Claude Code AgentArmy**

          This issue has been flagged for the AgentArmy. Open Claude Code and run:

          \`\`\`
          Work on issue #${{ github.event.issue.number }}
          \`\`\`

          Claude Code will delegate to the appropriate specialist agent based on the issue \`Type\` field.
          EOF
          )"
