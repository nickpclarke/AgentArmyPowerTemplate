name: Auto-add to project

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]

# This workflow authenticates with PROJECT_TOKEN (Projects v2 writes); the ambient
# GITHUB_TOKEN needs nothing, so lock it to a read-only floor.
permissions:
  contents: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        if: ${{ github.event.repository.owner.type == 'Organization' }}
        with:
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/${{ vars.PROJECT_NUMBER || '1' }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
      - uses: actions/add-to-project@v2.0.0
        if: ${{ github.event.repository.owner.type != 'Organization' }}
        with:
          project-url: https://github.com/users/${{ github.repository_owner }}/projects/${{ vars.PROJECT_NUMBER || '1' }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
