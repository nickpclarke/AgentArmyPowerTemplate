name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Check optional Static Web App source
        id: swa-source
        run: |
          if [ -d "agentarmy-console" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "agentarmy-console is not present; skipping optional Azure Static Web Apps deployment."
          fi

      - name: Install OIDC Client from Core Package
        if: steps.swa-source.outputs.exists == 'true'
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get Id Token
        if: steps.swa-source.outputs.exists == 'true'
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string

      - name: Build And Deploy
        if: steps.swa-source.outputs.exists == 'true'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_WAVE_05B48810F }}
          action: "upload"
          app_location: "/agentarmy-console"
          api_location: ""
          output_location: "dist"
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - uses: actions/checkout@v4

      - name: Check optional Static Web App source
        id: swa-source
        run: |
          if [ -d "agentarmy-console" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "agentarmy-console is not present; skipping optional Azure Static Web Apps PR cleanup."
          fi

      - name: Close Pull Request
        if: steps.swa-source.outputs.exists == 'true'
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_WAVE_05B48810F }}
          action: "close"
