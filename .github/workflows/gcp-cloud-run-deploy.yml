name: Deploy to Cloud Run

# Reusable, KEYLESS (Workload Identity Federation) container pipeline:
#   build image -> push to Artifact Registry -> deploy to Cloud Run.
#
# HUB NOTE: this is a TEMPLATE. It only runs via `workflow_call` (from a spoke
# caller workflow) or manual `workflow_dispatch`, so it never auto-deploys the
# Hub template repo itself. A spoke wires it up with a tiny caller workflow —
# see templates/gcp-cloud-run/github-actions-caller.yml.
#
# One-time GCP setup (run templates/gcp-cloud-run/setup/bootstrap-wif.sh):
#   - Artifact Registry Docker repo
#   - deploy service account (run.admin + artifactregistry.writer + serviceAccountUser)
#   - Workload Identity pool + provider scoped to the calling repo
# It prints the two secrets this workflow needs:
#   WORKLOAD_IDENTITY_PROVIDER  (full provider resource name)
#   DEPLOY_SERVICE_ACCOUNT      (service account email)

on:
  workflow_call:
    inputs:
      environment:
        description: Landscape to target (dev | qa | uat | prod). Maps to a GitHub Environment for env-scoped secrets and protection rules.
        required: false
        type: string
        default: ""
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: Cloud Run / Artifact Registry region
        required: false
        type: string
        default: us-central1
      service:
        description: Cloud Run service name
        required: true
        type: string
      artifact_repository:
        description: Artifact Registry repository name
        required: false
        type: string
        default: containers
      image_name:
        description: Image name (defaults to the service name)
        required: false
        type: string
        default: ""
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile
        required: false
        type: string
        default: Dockerfile
      allow_unauthenticated:
        description: Expose the service publicly (otherwise IAM-gated)
        required: false
        type: boolean
        default: false
      service_account:
        description: Runtime service account the Cloud Run service runs as (needs secretmanager.secretAccessor)
        required: false
        type: string
        default: ""
      set_secrets:
        description: Secret Manager wiring, e.g. "DB_PASSWORD=db-password:latest,API_KEY=api-key:latest"
        required: false
        type: string
        default: ""
      flags:
        description: Extra "gcloud run deploy" flags (e.g. --memory=512Mi --set-env-vars=FOO=bar)
        required: false
        type: string
        default: ""
    outputs:
      url:
        description: Deployed Cloud Run service URL
        value: ${{ jobs.deploy.outputs.url }}
  workflow_dispatch:
    inputs:
      environment:
        description: Landscape to target (dev | qa | uat | prod)
        required: false
        type: string
        default: ""
      project_id:
        description: GCP project ID
        required: true
        type: string
      region:
        description: Cloud Run / Artifact Registry region
        required: true
        type: string
        default: us-central1
      service:
        description: Cloud Run service name
        required: true
        type: string
      artifact_repository:
        description: Artifact Registry repository name
        required: true
        type: string
        default: containers
      allow_unauthenticated:
        description: Expose the service publicly (otherwise IAM-gated)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # required for keyless Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Binds env-scoped secrets + protection rules (e.g. required reviewers on prod).
    environment:
      name: ${{ inputs.environment }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image reference and deploy flags
        id: vars
        run: |
          IMAGE_NAME="${{ inputs.image_name }}"
          [ -z "$IMAGE_NAME" ] && IMAGE_NAME="${{ inputs.service }}"
          IMAGE="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

          FLAGS="${{ inputs.flags }}"
          if [ "${{ inputs.allow_unauthenticated }}" = "true" ]; then
            FLAGS="$FLAGS --allow-unauthenticated"
          else
            FLAGS="$FLAGS --no-allow-unauthenticated"
          fi
          [ -n "${{ inputs.service_account }}" ] && FLAGS="$FLAGS --service-account=${{ inputs.service_account }}"
          [ -n "${{ inputs.set_secrets }}" ] && FLAGS="$FLAGS --set-secrets=${{ inputs.set_secrets }}"
          echo "flags=${FLAGS}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (keyless)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build \
            -f "${{ inputs.dockerfile }}" \
            -t "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}" \
            -t "${{ steps.vars.outputs.image }}:latest" \
            "${{ inputs.context }}"
          docker push "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          docker push "${{ steps.vars.outputs.image }}:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ inputs.service }}
          region: ${{ inputs.region }}
          project_id: ${{ inputs.project_id }}
          image: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
          flags: ${{ steps.vars.outputs.flags }}

      - name: Summary
        run: |
          echo "### Cloud Run deploy :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Landscape: \`${{ inputs.environment || 'default' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: \`${{ inputs.service }}\` (${{ inputs.region }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
