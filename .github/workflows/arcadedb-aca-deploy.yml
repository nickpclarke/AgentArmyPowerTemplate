# arcadedb-aca-deploy.yml — HUB-OWNED PLATFORM DEPLOYMENT (ARC-ADR-023)
#
# This workflow deploys the SHARED ArcadeDB platform instance for the entire
# fleet. The hub (AgentArmy) owns this lane; spokes do NOT vendor or run their
# own ArcadeDB — they connect to the URL emitted by this deploy via env
# (ARCADEDB_URL). See ARC-ADR-023 (Platform Image Ownership) and
# docs/decisions/ARC-ADR-023-container-tiering-strategy.md.
#
# It builds the ArcadeDB image from templates/arcadedb-image/Dockerfile,
# pushes to ACR, then deploys arcadedb-aca.bicep into the dev resource group.
#
# Authentication is fully OIDC / passwordless — no long-lived credentials.
# Required GitHub secrets (Settings → Secrets → Actions, hub repo):
#   AZURE_CLIENT_ID        — app registration / managed identity client ID
#   AZURE_TENANT_ID        — Entra ID tenant ID
#   AZURE_SUBSCRIPTION_ID  — subscription ID
#
# Required GitHub variables (Settings → Variables → Actions, hub repo):
#   AZURE_ACR_LOGIN_SERVER — e.g. agentarmy.azurecr.io
#   AZURE_RESOURCE_GROUP   — e.g. rg-arcadedb-dev
#
# One-time bootstrap: see templates/arcadedb-image/deploy/README.md
# Trigger: manually via Actions UI, or via `gh workflow run arcadedb-aca-deploy.yml`.

name: Deploy ArcadeDB to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and deploy (defaults to short SHA)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging

  push:
    branches:
      - main
    paths:
      - 'templates/arcadedb-image/**'
      - 'templates/arcadedb-image/deploy/arcadedb-aca.bicep'
      - 'templates/arcadedb-image/deploy/arcadedb-aca-parameters-dev.bicepparam'

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

concurrency:
  group: arcadedb-aca-deploy-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-flight DB deploy

env:
  # Override these via repo/environment variables rather than editing this file.
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-arcadedb-dev' }}
  AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
  IMAGE_NAME: agentarmy-arcadedb
  DOCKERFILE_PATH: templates/arcadedb-image/Dockerfile
  BUILD_CONTEXT: templates/arcadedb-image
  BICEP_FILE: templates/arcadedb-image/deploy/arcadedb-aca.bicep
  PARAM_FILE: templates/arcadedb-image/deploy/arcadedb-aca-parameters-dev.bicepparam

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & push image to ACR
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push ArcadeDB image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve-tag.outputs.image_tag }}
      image_ref: ${{ steps.resolve-tag.outputs.image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve-tag
        # All github-context and inputs values are bound to env vars first so
        # they are never interpolated directly into shell commands (CWE-78).
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            TAG="${INPUT_IMAGE_TAG}"
          else
            TAG="${GIT_SHA:0:8}"
          fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${AZURE_ACR_LOGIN_SERVER}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR via Azure CLI
        run: |
          ACR_NAME=$(echo "${AZURE_ACR_LOGIN_SERVER}" | cut -d. -f1)
          az acr login --name "${ACR_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ steps.resolve-tag.outputs.image_ref }}
            ${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          # Re-use layer cache from ACR to speed up subsequent builds
          cache-from: type=registry,ref=${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to:   type=registry,ref=${{ env.AZURE_ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          provenance: false  # reduces manifest size; remove if you need SBOM

  # ---------------------------------------------------------------------------
  # Job 2: Deploy Bicep
  # ---------------------------------------------------------------------------
  deploy-bicep:
    name: Deploy Bicep to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ inputs.environment || 'dev' }}  # maps to GitHub environment for approval gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "${AZURE_RESOURCE_GROUP}" \
            --location eastus \
            --output none
          echo "Resource group ready: ${AZURE_RESOURCE_GROUP}"

      - name: What-if preview (informational — never blocks)
        # IMAGE_TAG and IMAGE_REF come from the previous job's outputs.
        # They are bound to step-level env vars so they never touch the shell
        # command line via direct ${{ }} interpolation (CWE-78).
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          az deployment group what-if \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file "${BICEP_FILE}" \
            --parameters "${PARAM_FILE}" \
            --parameters imageTag="${IMAGE_TAG}" \
            --parameters acrLoginServer="${AZURE_ACR_LOGIN_SERVER}" \
            --no-pretty-print \
            --output table || true  # what-if non-zero exit does not fail the deploy

      - name: Deploy Bicep
        id: bicep-deploy
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          RESULT=$(az deployment group create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --template-file "${BICEP_FILE}" \
            --parameters "${PARAM_FILE}" \
            --parameters imageTag="${IMAGE_TAG}" \
            --parameters acrLoginServer="${AZURE_ACR_LOGIN_SERVER}" \
            --output json)

          STATE=$(echo "${RESULT}" | jq -r '.properties.provisioningState')
          if [ "${STATE}" != "Succeeded" ]; then
            echo "Deployment ended with state: ${STATE}"
            exit 1
          fi

          FQDN=$(echo "${RESULT}" | jq -r '.properties.outputs.containerAppFqdn.value // empty')
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"
          echo "Deployed. FQDN: ${FQDN}"

      - name: Smoke-test readiness endpoint
        # Retry for up to 3 minutes — JVM cold-start can be slow on first revision.
        # FQDN comes from the previous step's output; bound to env var first.
        env:
          DEPLOY_FQDN: ${{ steps.bicep-deploy.outputs.fqdn }}
        run: |
          if [ -z "${DEPLOY_FQDN}" ]; then
            echo "FQDN not available; skipping smoke test"
            exit 0
          fi
          URL="https://${DEPLOY_FQDN}/api/v1/ready"
          echo "Polling ${URL} ..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${URL}" || echo "000")
            if [ "${STATUS}" = "204" ]; then
              echo "Ready (HTTP 204) after $((i * 10))s"
              exit 0
            fi
            echo "  attempt ${i}: HTTP ${STATUS} — waiting 10s"
            sleep 10
          done
          echo "ArcadeDB did not become ready within 3 minutes."
          exit 1

      - name: Summary
        if: always()
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_ref }}
          DEPLOY_FQDN: ${{ steps.bicep-deploy.outputs.fqdn }}
        run: |
          {
            echo "## ArcadeDB ACA Deploy"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE_REF}\` |"
            echo "| Resource group | \`${AZURE_RESOURCE_GROUP}\` |"
            echo "| FQDN | \`${DEPLOY_FQDN}\` |"
            echo "| Ready URL | https://${DEPLOY_FQDN}/api/v1/ready |"
          } >> "$GITHUB_STEP_SUMMARY"
