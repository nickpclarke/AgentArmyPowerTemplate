name: Validate routing policy

on:
  push:
    paths:
      - ".github/routing-policy.yaml"
      - "tools/validate-routing.mjs"
      - ".github/workflows/validate-routing.yml"
  pull_request:
    paths:
      - ".github/routing-policy.yaml"
      - "tools/validate-routing.mjs"
      - ".github/workflows/validate-routing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-routing:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pyyaml (for YAML parsing in validator)
        run: pip install pyyaml --quiet

      - name: Run routing policy validator
        run: node tools/validate-routing.mjs
