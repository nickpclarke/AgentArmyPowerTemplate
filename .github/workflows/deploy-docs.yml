name: Deploy Documentation

on:
  push:
    branches:
      - main
      - claude/mkdocs-pipeline-repos-*
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/deploy-docs.yml'
      - 'README.md'
      - 'CLAUDE.md'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Generate agent documentation
        run: |
          echo "Generating agent glossary from source definitions..."
          python scripts/generate_agent_docs.py

      - name: Sync spoke platform docs (frontend/backend/middle → docs/platform/)
        env:
          # Read access to the private spoke repos. PROJECT_TOKEN is a classic PAT with
          # repo scope already used across the fleet. Graceful: a missing token or an
          # unavailable spoke is skipped with a warning, never fails the docs build.
          SPOKE_SYNC_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          chmod +x scripts/sync-spoke-docs.sh
          ./scripts/sync-spoke-docs.sh

      - name: Build documentation
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
