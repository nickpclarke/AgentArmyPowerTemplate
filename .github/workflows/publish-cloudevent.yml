name: publish-cloudevent

# Reusable workflow — any workflow can call this to publish a CloudEvent v1.0
# to a NATS JetStream subject. Closes the "GitHub events into the fleet bus"
# loop WITHOUT exposing a public webhook receiver (ARC-ADR-022 Option F).
#
# Caller example:
#   jobs:
#     emit:
#       uses: nickpclarke/AgentArmy/.github/workflows/publish-cloudevent.yml@main
#       with:
#         subject: fleet.gh.pr_merged
#         type:    github.pr_merged
#         data:    '{"pr": ${{ github.event.pull_request.number }}, "repo": "${{ github.repository }}"}'
#       secrets:
#         NATS_URL: ${{ secrets.NATS_URL }}   # e.g. nats://nats.acme.internal:4222

on:
  workflow_call:
    inputs:
      subject:
        description: NATS subject (e.g. fleet.gh.pr_merged)
        required: true
        type: string
      type:
        description: CloudEvents `type` (e.g. github.pr_merged)
        required: true
        type: string
      source:
        description: CloudEvents `source` URI
        required: false
        type: string
        default: "https://github.com/${{ github.repository }}"
      data:
        description: CloudEvents `data` (JSON string)
        required: false
        type: string
        default: "{}"
    secrets:
      NATS_URL:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: natsio/nats-box:latest
    steps:
      - name: Compose + publish CloudEvent
        env:
          NATS_URL: ${{ secrets.NATS_URL }}
          SUBJECT:  ${{ inputs.subject }}
          CE_TYPE:  ${{ inputs.type }}
          CE_SOURCE: ${{ inputs.source }}
          CE_DATA:  ${{ inputs.data }}
          CE_ID:    ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          # Build the CloudEvent v1.0 envelope. jq guarantees valid JSON in `data`.
          CE_TIME="$(date -u +%FT%TZ)"
          payload="$(jq -n \
            --arg id "$CE_ID" --arg source "$CE_SOURCE" --arg type "$CE_TYPE" --arg time "$CE_TIME" \
            --argjson data "$CE_DATA" \
            '{specversion:"1.0", id:$id, source:$source, type:$type, datacontenttype:"application/json", time:$time, data:$data}')"
          echo "publishing to $SUBJECT"
          printf '%s' "$payload" | nats --server "$NATS_URL" pub "$SUBJECT" --
