name: Update Agent Counts

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    paths:
      - '.claude/agents/categories/**'
      - '.github/workflows/update-agent-counts.yml'
  workflow_dispatch:

jobs:
  update-counts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate agent counts
        run: |
          {
            echo "# Agent Counts by Category"
            echo ""
            echo "Auto-generated agent inventory. Last updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "| # | Category | Count |"
            echo "|---|----------|-------|"

            total=0

            for dir in .claude/agents/categories/[0-9]*; do
              if [ -d "$dir" ]; then
                category=$(basename "$dir")
                num=$(echo "$category" | sed 's/^\([0-9]*\)-.*/\1/' | sed 's/^0//')
                name=$(echo "$category" | sed 's/^[0-9]*-//' | tr '-' ' ' | sed 's/\b\(.\)/\U\1/g')

                count=$(find "$dir" -name "*.md" \
                  ! -name "README.md" \
                  ! -name "TAXONOMY.md" | wc -l)

                if [ "$count" -gt 0 ]; then
                  total=$((total + count))
                  printf "| %d | %-30s | %d |\n" "$num" "$name" "$count"
                fi
              fi
            done

            echo "|  | **TOTAL** | **$total** |"
            echo ""
            echo "---"
            echo ""
            echo "## How This Works"
            echo ""
            echo "- Counts are updated automatically daily and whenever agents are added/removed"
            echo "- Workflow: [update-agent-counts.yml](.github/workflows/update-agent-counts.yml)"
            echo "- Each count includes all agent definition files (.md) in the category folder and subfolders"
            echo "- Excludes README.md and TAXONOMY.md reference files"

          } > docs/AGENT_COUNTS.md

          # Print output for logging
          cat docs/AGENT_COUNTS.md

      - name: Create or update summary table header
        run: |
          # Add counts summary to beginning of AGENTS.md (before first category)
          if ! grep -q "## Agent Counts Summary" docs/agents.md; then
            # Insert counts summary reference after intro, before first category
            sed -i '/^### 01/i ## Agent Counts by Category\n\nSee [AGENT_COUNTS.md](AGENT_COUNTS.md) for an auto-updated inventory of agents per category.\n' docs/agents.md
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/AGENT_COUNTS.md docs/agents.md
          git diff --cached --quiet || git commit -m "Update agent counts

Auto-generated by update-agent-counts.yml workflow"

      - name: Push changes
        run: git push
