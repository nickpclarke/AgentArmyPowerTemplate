name: middle-core model loop

on:
  pull_request:
    paths:
      - "model/middle-core/**"
      - "tools/modelgen/**"
      - "templates/middle-core/**"
      - "tests/test_middle_core_modelgen.py"
      - "tests/test_middle_core_drift.py"
      - ".github/workflows/middle-core-model.yml"
  push:
    branches: [main]
    paths:
      - "model/middle-core/**"
      - "tools/modelgen/**"
      - "templates/middle-core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  middle-core-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Python deps
        run: pip install pyyaml pyshacl

      - name: Validate model
        run: python tools/modelgen/validate_middle_core.py --model model/middle-core/model.yaml

      - name: Generated-code drift gate
        run: python tools/modelgen/check_drift.py

      - name: modelgen + drift unit tests
        run: python -m unittest tests.test_middle_core_modelgen tests.test_middle_core_drift

      - name: Validate generated SHACL fixture
        run: pyshacl -s templates/middle-core/generated/model-runtime.shacl.ttl templates/middle-core/generated/model-runtime.fixture.ttl

      - name: Build middle-core
        run: dotnet build templates/middle-core/MiddleCore.csproj

      - name: Test middle-core
        run: dotnet test templates/middle-core/MiddleCore.Tests/MiddleCore.Tests.csproj
