name: Story
description: Implementable unit of work
title: "[Story]: "
labels: ["story"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true when this is complete?
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Suggested route
      options:
        - copilot-task
        - ai-agent-task
