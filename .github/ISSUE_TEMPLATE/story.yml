name: "Story"
description: "User-facing value, completable in a single sprint."
title: "[Story]: "
labels: ["Story"]
body:
  - type: markdown
    attributes:
      value: |
        A Story delivers user-facing value within one sprint. After creating,
        set **Type**, **PI**, **Size**, **Estimate**, and link the **Parent
        issue** (its Feature) on the project board. Definition of Ready requires
        acceptance criteria below.
  - type: textarea
    id: story
    attributes:
      label: User story
      description: As a <role>, I want <capability>, so that <benefit>.
      placeholder: As a developer, I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist that defines "done".
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Links, designs, constraints, dependencies.
    validations:
      required: false
