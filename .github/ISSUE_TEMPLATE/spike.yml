name: "Spike"
description: "Time-boxed research to reduce uncertainty before committing to work."
title: "[Spike]: "
labels: ["Spike"]
body:
  - type: markdown
    attributes:
      value: |
        A Spike is time-boxed research. After creating, set **Type**, **PI**, and
        **Size** on the project board. The deliverable is a decision or findings,
        not shippable code.
  - type: textarea
    id: question
    attributes:
      label: Question to answer
      description: What do we need to learn or decide?
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time box
      placeholder: e.g. 1 day, 2 days
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What artifact ends the spike (recommendation, prototype, ADR, etc.)?
    validations:
      required: true
