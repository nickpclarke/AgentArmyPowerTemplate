version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "Enabler"
      - "dependencies"

  # Copilot Chat extension (Node.js).
  - package-ecosystem: "npm"
    directory: "/extensions/board-manager"
    schedule:
      interval: "weekly"
    labels:
      - "Enabler"
      - "dependencies"

  # Documentation build dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "Enabler"
      - "dependencies"

  # dlt pipeline toolkit.
  - package-ecosystem: "pip"
    directory: "/pipelines"
    schedule:
      interval: "weekly"
    labels:
      - "Enabler"
      - "dependencies"
