# Copilot Coding Agent — Environment Setup
# This file configures the microVM environment for the GitHub Copilot coding agent.
# It runs before the agent starts working on any issue.
#
# Docs: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent

steps:
  - name: Install GitHub CLI
    run: |
      set -euo pipefail
      if command -v gh >/dev/null 2>&1; then
        echo "GitHub CLI already installed:"
        gh --version
      else
        echo "Installing GitHub CLI from the official apt repository"
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
        sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
          | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y gh
        gh --version
      fi

  - name: Set up Python for docs validation
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install documentation dependencies
    run: pip install -r requirements-docs.txt

  - name: Set up Node.js (for board-manager extension)
    uses: actions/setup-node@v4
    with:
      node-version: "20"
