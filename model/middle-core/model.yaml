schema_version: middle-core-model.v1
model_id: middle-core-runtime-prototype

referenced_artifacts:
  ontology:
    - id: middle-core-ontology
      path: ontology/middle-core.ttl
    - id: middle-core-ufo-lite
      path: ontology/top-level-ufo-lite.ttl
  workflows:
    - id: knowledge-drop
      path: workflows/knowledge-drop.bpmn
  decisions:
    - id: source-activation-policy
      path: decisions/source-activation-policy.dmn
  projections:
    - id: arcadedb-projections
      path: projections/arcadedb.yaml

use_cases:
  - { id: UC-01, title: Land knowledge and prove it is searchable }
  - { id: UC-02, title: Ask for a semantic constellation }
  - { id: UC-03, title: Inspect ArcadeDB schema safely }
  - { id: UC-04, title: Run a bounded read-only query }
  - { id: UC-05, title: Route work to a specialist pod }
  - { id: UC-06, title: Prove work is done }
  - { id: UC-07, title: Exercise a capability before promotion }
  - { id: UC-08, title: Promote a scenario into an MCP tool }
  - { id: UC-09, title: Disable or degrade an unsafe tool/capability }
  - { id: UC-10, title: Generate typed object contracts }
  - { id: UC-11, title: Review a decision and downstream effects }
  - { id: UC-12, title: Recover a failed ingest or scenario run }
  - { id: UC-13, title: Curate a trusted knowledge source }
  - { id: UC-14, title: Review chunks before promotion }
  - { id: UC-15, title: Retrieve approved context for a task }
  - { id: UC-16, title: Recommend a tool offering }

object_types:
  - id: knowledge-source
    data_object: KnowledgeSourceData
    ontology_concept: SemanticAsset
    states: [landed, ingesting, indexed, searchable, archived, failed]
    state_machine: knowledge-source-lifecycle
    use_cases: [UC-01, UC-13, UC-15]
  - id: knowledge-chunk
    data_object: KnowledgeChunkData
    ontology_concept: SemanticAsset
    states: [created, embedded, searchable, stale, failed]
    state_machine: knowledge-chunk-lifecycle
    use_cases: [UC-01, UC-02, UC-14, UC-15]
  - id: knowledge-graph-snapshot
    data_object: GraphSnapshotData
    ontology_concept: SemanticAsset
    states: [requested, materialized, published, expired, failed]
    state_machine: knowledge-graph-snapshot-lifecycle
    use_cases: [UC-02, UC-03, UC-15]
  - id: capability-exercise
    data_object: CapabilityExerciseData
    ontology_concept: CapabilityObservation
    states: [draft, ready, running, passed, failed, deprecated]
    state_machine: capability-exercise-lifecycle
    use_cases: [UC-01, UC-07, UC-12]
  - id: evidence-pack
    data_object: EvidencePackData
    ontology_concept: EvidenceBundle
    states: [collecting, complete, waived, rejected, expired]
    state_machine: evidence-pack-lifecycle
    use_cases: [UC-01, UC-06, UC-12]
  - id: work-packet
    data_object: WorkPacketData
    ontology_concept: ActorIntent
    states: [todo, ready, in-progress, in-review, done, blocked, awaiting-decision]
    state_machine: work-packet-lifecycle
    use_cases: [UC-05, UC-06, UC-15]
  - id: decision-record
    data_object: DecisionRecordData
    ontology_concept: GovernedDecision
    states: [proposed, accepted, rejected, superseded]
    state_machine: decision-record-lifecycle
    use_cases: [UC-05, UC-08, UC-11]
  - id: tool-offering
    data_object: ToolOfferingData
    ontology_concept: ToolCandidate
    states: [candidate, schema-ready, enabled, disabled, deprecated]
    state_machine: tool-offering-lifecycle
    use_cases: [UC-08, UC-09, UC-16]
  - id: scenario-template
    data_object: ScenarioTemplateData
    ontology_concept: ScenarioContract
    states: [draft, validated, published, retired]
    state_machine: scenario-template-lifecycle
    use_cases: [UC-07, UC-08, UC-10, UC-16]

data_objects:
  - name: KnowledgeSourceData
    properties:
      source_id: string
      display_name: string
      state: string
      provider_ref: string
  - name: KnowledgeChunkData
    properties:
      chunk_id: string
      source_id: string
      excerpt: string
      state: string
  - name: GraphSnapshotData
    properties:
      snapshot_id: string
      source_ids: string[]
      node_count: int
      edge_count: int
  - name: CapabilityExerciseData
    properties:
      exercise_id: string
      scenario_id: string
      status: string
      evidence_pack_id: string
  - name: EvidencePackData
    properties:
      evidence_pack_id: string
      status: string
      claim_count: int
      artifact_refs: string[]
  - name: WorkPacketData
    properties:
      work_packet_id: string
      title: string
      state: string
      evidence_pack_id: string
  - name: DecisionRecordData
    properties:
      decision_id: string
      status: string
      rationale: string
      target_object_id: string
  - name: ToolOfferingData
    properties:
      tool_id: string
      scenario_id: string
      state: string
      policy_status: string
  - name: ScenarioTemplateData
    properties:
      scenario_id: string
      version: string
      workflow_id: string
      decision_refs: string[]

relationship_types:
  - id: contains
    from: knowledge-source
    to: knowledge-chunk
  - id: produces
    from: knowledge-source
    to: evidence-pack
  - id: exercises
    from: capability-exercise
    to: scenario-template
  - id: proven-by
    from: capability-exercise
    to: evidence-pack
  - id: supports
    from: evidence-pack
    to: knowledge-source

state_machines:
  - id: knowledge-source-lifecycle
    object_type: knowledge-source
    states: [landed, ingesting, indexed, searchable, archived, failed]
    initial_state: landed
    terminal_states: [searchable, archived, failed]
    transitions:
      - { from: landed, to: ingesting, trigger: ingest-started }
      - { from: ingesting, to: indexed, trigger: chunks-indexed }
      - { from: indexed, to: searchable, trigger: evidence-complete }
      - { from: landed, to: failed, trigger: policy-rejected }
      - { from: ingesting, to: failed, trigger: ingest-failed }
      - { from: searchable, to: archived, trigger: source-retired }
  - id: knowledge-chunk-lifecycle
    object_type: knowledge-chunk
    states: [created, embedded, searchable, stale, failed]
    initial_state: created
    terminal_states: [searchable, failed]
    transitions:
      - { from: created, to: embedded, trigger: embedding-written }
      - { from: embedded, to: searchable, trigger: index-updated }
      - { from: searchable, to: stale, trigger: source-version-changed }
      - { from: stale, to: embedded, trigger: reembedded }
      - { from: created, to: failed, trigger: chunk-rejected }
  - id: knowledge-graph-snapshot-lifecycle
    object_type: knowledge-graph-snapshot
    states: [requested, materialized, published, expired, failed]
    initial_state: requested
    terminal_states: [published, expired, failed]
    transitions:
      - { from: requested, to: materialized, trigger: query-completed }
      - { from: materialized, to: published, trigger: review-approved }
      - { from: published, to: expired, trigger: freshness-window-ended }
      - { from: requested, to: failed, trigger: query-failed }
  - id: capability-exercise-lifecycle
    object_type: capability-exercise
    states: [draft, ready, running, passed, failed, deprecated]
    initial_state: draft
    terminal_states: [passed, failed, deprecated]
    transitions:
      - { from: draft, to: ready, trigger: scenario-bound }
      - { from: ready, to: running, trigger: execution-started }
      - { from: running, to: passed, trigger: evidence-accepted }
      - { from: running, to: failed, trigger: evidence-rejected }
      - { from: passed, to: deprecated, trigger: capability-retired }
  - id: evidence-pack-lifecycle
    object_type: evidence-pack
    states: [collecting, complete, waived, rejected, expired]
    initial_state: collecting
    terminal_states: [complete, waived, rejected, expired]
    transitions:
      - { from: collecting, to: complete, trigger: required-claims-met }
      - { from: collecting, to: waived, trigger: human-waiver }
      - { from: collecting, to: rejected, trigger: claim-failed }
      - { from: complete, to: expired, trigger: retention-ended }
  - id: work-packet-lifecycle
    object_type: work-packet
    states: [todo, ready, in-progress, in-review, done, blocked, awaiting-decision]
    initial_state: todo
    terminal_states: [done]
    transitions:
      - { from: todo, to: ready, trigger: scope-accepted }
      - { from: ready, to: in-progress, trigger: owner-started }
      - { from: in-progress, to: in-review, trigger: evidence-submitted }
      - { from: in-review, to: done, trigger: review-approved }
      - { from: in-progress, to: blocked, trigger: blocker-raised }
      - { from: blocked, to: awaiting-decision, trigger: decision-required }
      - { from: awaiting-decision, to: ready, trigger: decision-accepted }
  - id: decision-record-lifecycle
    object_type: decision-record
    states: [proposed, accepted, rejected, superseded]
    initial_state: proposed
    terminal_states: [accepted, rejected, superseded]
    transitions:
      - { from: proposed, to: accepted, trigger: approver-accepted }
      - { from: proposed, to: rejected, trigger: approver-rejected }
      - { from: accepted, to: superseded, trigger: new-decision-accepted }
  - id: tool-offering-lifecycle
    object_type: tool-offering
    states: [candidate, schema-ready, enabled, disabled, deprecated]
    initial_state: candidate
    terminal_states: [enabled, disabled, deprecated]
    transitions:
      - { from: candidate, to: schema-ready, trigger: schemas-generated }
      - { from: schema-ready, to: enabled, trigger: promotion-approved }
      - { from: schema-ready, to: disabled, trigger: policy-failed }
      - { from: enabled, to: disabled, trigger: kill-switch-activated }
      - { from: enabled, to: deprecated, trigger: replacement-published }
  - id: scenario-template-lifecycle
    object_type: scenario-template
    states: [draft, validated, published, retired]
    initial_state: draft
    terminal_states: [published, retired]
    transitions:
      - { from: draft, to: validated, trigger: model-validation-passed }
      - { from: validated, to: published, trigger: governance-approved }
      - { from: published, to: retired, trigger: scenario-retired }

workflow_steps:
  - id: validate-source-policy
    handler: ValidateSourcePolicy
    reads: [knowledge-source]
    writes: [decision-record]
  - id: land-raw-object
    handler: LandRawObject
    reads: [knowledge-source]
    writes: [knowledge-source]
  - id: generate-knowledge-chunks
    handler: GenerateKnowledgeChunks
    reads: [knowledge-source]
    writes: [knowledge-chunk]
  - id: assemble-ingest-evidence
    handler: AssembleIngestEvidence
    reads: [knowledge-source, knowledge-chunk, capability-exercise]
    writes: [evidence-pack]

scenarios:
  - id: knowledge-drop
    workflow_ref: knowledge-drop
    decision_refs: [source-activation-policy]
    input_objects: [knowledge-source]
    output_objects: [decision-record, knowledge-source, knowledge-chunk, capability-exercise, evidence-pack]
    workflow_steps:
      - validate-source-policy
      - land-raw-object
      - generate-knowledge-chunks
      - assemble-ingest-evidence
    use_cases: [UC-01, UC-13]

projections:
  - id: arcadedb-knowledge-source
    target: arcadedb
    object_type: knowledge-source
    direction: read-write
    provider_records: [RawObject, StoredFile, IngestJob]
  - id: arcadedb-knowledge-chunk
    target: arcadedb
    object_type: knowledge-chunk
    direction: read
    provider_records: [Chunk, ImageObject, Embedding]
