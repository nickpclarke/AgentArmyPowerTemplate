# =============================================================================
# A-Box — real AgentArmy system instances, snapshot 2026-05-30.
# Source: docs/contracts.md (contract-bindings), the fleet-heartbeat container
# inventory (containers/tiers), CLAUDE.md + contracts.md upstream (platforms,
# partners), docs/decisions/ (ADRs). SLOW-MOVING STRUCTURAL FACTS ONLY — live
# work-item status is federated from GitHub at query time, never frozen here.
# Consumed by tools/selfmodel/emit.py to produce fragments + projections.
# =============================================================================

repositories:
  - { id: repo-agentarmy,     type: HubRepository,   name: AgentArmy,      repoRole: Hub,   primaryLanguage: "py/ps/md", evolutionStage: Custom }
  - { id: repo-backend-core,  type: SpokeRepository, name: backend-core,   repoRole: Spoke, layer: data,   primaryLanguage: "py/rust", evolutionStage: Custom,  criticality: 3 }
  - { id: repo-middle-core,   type: SpokeRepository, name: middle-core,    repoRole: Spoke, layer: middle, primaryLanguage: "csharp",  evolutionStage: Custom,  criticality: 2 }
  - { id: repo-frontend-core, type: SpokeRepository, name: frontend-core,  repoRole: Spoke, layer: ui,     primaryLanguage: "ts",      evolutionStage: Custom,  criticality: 2 }
  - { id: repo-forge,         type: SpokeRepository, name: agentarmy-forge, repoRole: Spoke, layer: forge,  primaryLanguage: "py",      evolutionStage: Genesis, criticality: 1 }

contracts:
  - { id: con-data-api,      type: Contract, name: "Data API",                 format: OpenAPI,     status: Shipped,   governingAdr: ARC-ADR-005, evolutionStage: Product }
  - { id: con-model,         type: Contract, name: "Model contracts",          format: SharedTypes, status: Shipped,   governingAdr: "—",         evolutionStage: Custom }
  - { id: con-data-platform, type: Contract, name: "Data-platform contract",   format: JSON_Schema, status: Shipped,   governingAdr: ARC-ADR-009, evolutionStage: Custom }
  - { id: con-jwt-auth,      type: Contract, name: "JWT-forwarding auth",      format: HTTP_Header, status: Proposed,  governingAdr: ARC-ADR-002, evolutionStage: Custom }
  - { id: con-copilotkit,    type: Contract, name: "Agent endpoint /copilotkit", format: OpenAPI,   status: Proposed,  governingAdr: ARC-ADR-003, evolutionStage: Custom }
  - { id: con-mcr-f4,        type: Contract, name: "MCR-F4 projection-read API", format: OpenAPI,   status: Shipped,   governingAdr: ARC-ADR-016, evolutionStage: Genesis }
  - { id: con-bff,           type: Contract, name: "Frontend BFF",             format: OpenAPI,     status: Shipped,   governingAdr: ARC-ADR-002, evolutionStage: Custom }
  - { id: con-agui,          type: Contract, name: "AG-UI agent stream",       format: AsyncAPI,    status: Proposed,  governingAdr: ARC-ADR-007, evolutionStage: Custom }
  - { id: con-llm-gw,        type: Contract, name: "LLM gateway",              format: OpenAPI,     status: Proposed,  governingAdr: ARC-ADR-021, evolutionStage: Product }
  - { id: con-agent-gw,      type: Contract, name: "Agent gateway (A2A+MCP)",  format: OpenAPI,     status: Shipped,   governingAdr: ARC-ADR-028, evolutionStage: Genesis }
  - { id: con-event-bus,     type: Contract, name: "Event bus (NATS+CloudEvents)", format: AsyncAPI, status: Proposed, governingAdr: ARC-ADR-022, evolutionStage: Product }
  - { id: con-webhook,       type: Contract, name: "Webhook receiver",         format: OpenAPI,     status: Proposed,  governingAdr: ARC-ADR-022, evolutionStage: Product }
  - { id: con-runbook,       type: Contract, name: "Runbook orchestrator API", format: OpenAPI,     status: Proposed,  governingAdr: ARC-ADR-031, evolutionStage: Custom }
  - { id: con-fleet-vocab,   type: Contract, name: "Fleet interface vocabulary", format: RDF_OWL,   status: Shipped,   governingAdr: ARC-ADR-032, evolutionStage: Genesis }

containers:
  # Platform tier (stateful, slow)
  - { id: ctr-arcadedb,   type: PlatformContainer,    name: agentarmy-arcadedb,        tier: Platform,    deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Product }
  - { id: ctr-fuseki,     type: PlatformContainer,    name: agentarmy-fuseki-ontology, tier: Platform,    deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Product }
  # Application tier (one per spoke, stateless)
  - { id: ctr-backend,    type: ApplicationContainer, name: backend-core,              tier: Application, deployTarget: aca, owner: repo-backend-core, evolutionStage: Custom }
  # Function tier (small, stateless, independently rolled)
  - { id: ctr-abstraction, type: FunctionContainer, name: agentarmy-abstraction-mcp,    tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Custom }
  - { id: ctr-board-sync,  type: FunctionContainer, name: agentarmy-board-sync,         tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Custom }
  - { id: ctr-event-bridge, type: FunctionContainer, name: agentarmy-event-bridge,      tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Custom }
  - { id: ctr-forge,       type: FunctionContainer, name: agentarmy-forge,              tier: Function, deployTarget: aca, owner: repo-forge,        evolutionStage: Genesis }
  - { id: ctr-hmac,        type: FunctionContainer, name: agentarmy-hmac-verify,        tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Product }
  - { id: ctr-jwt,         type: FunctionContainer, name: agentarmy-jwt-introspect,     tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Product }
  - { id: ctr-embedder,    type: FunctionContainer, name: agentarmy-local-embedder,     tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Custom }
  - { id: ctr-otel,        type: FunctionContainer, name: agentarmy-otel-collector,     tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Commodity }
  - { id: ctr-runbook,     type: FunctionContainer, name: agentarmy-runbook-orchestrator, tier: Function, deployTarget: aca, owner: repo-agentarmy,  evolutionStage: Custom }
  - { id: ctr-migrator,    type: FunctionContainer, name: agentarmy-schema-migrator,    tier: Function, deployTarget: aca, owner: repo-agentarmy,    evolutionStage: Product }
  - { id: ctr-creds,       type: FunctionContainer, name: agentarmy-credentials-broker, tier: Function, deployTarget: aca, owner: repo-backend-core, evolutionStage: Custom }
  - { id: ctr-llm-gw,      type: FunctionContainer, name: agentarmy-llm-gateway,        tier: Function, deployTarget: aca, owner: repo-backend-core, evolutionStage: Product }

platforms:
  - { id: plat-aca,      type: Platform, name: "Azure Container Apps",  platformKind: Cloud,        vendor: Microsoft, evolutionStage: Commodity }
  - { id: plat-keyvault, type: Platform, name: "Azure Key Vault",       platformKind: SecretStore,  vendor: Microsoft, evolutionStage: Commodity }
  - { id: plat-arcadedb, type: Platform, name: "ArcadeDB",              platformKind: GraphDB,      vendor: ArcadeData, evolutionStage: Product }
  - { id: plat-fuseki,   type: Platform, name: "Apache Jena Fuseki",    platformKind: Triplestore,  vendor: Apache,    evolutionStage: Product }
  - { id: plat-nats,     type: Platform, name: "NATS JetStream",        platformKind: Broker,       vendor: Synadia,   evolutionStage: Product }
  - { id: plat-postgres, type: Platform, name: "Postgres (DBOS)",       platformKind: RelationalDB, vendor: DBOS,      evolutionStage: Commodity }
  - { id: plat-gcp,      type: Platform, name: "GCP Cloud Run",         platformKind: Cloud,        vendor: Google,    evolutionStage: Commodity }
  - { id: plat-postman,  type: Platform, name: "Postman",               platformKind: APITooling,   vendor: Postman,   evolutionStage: Product }
  - { id: plat-cf,       type: Platform, name: "Cloudflare",            platformKind: EdgeCDN,      vendor: Cloudflare, evolutionStage: Commodity }
  - { id: plat-github,   type: Platform, name: "GitHub",                platformKind: VCSHost,      vendor: Microsoft, evolutionStage: Commodity }

organizations:
  - { id: org-anthropic,  type: ExternalOrganization, name: Anthropic,   orgName: Anthropic }
  - { id: org-microsoft,  type: ExternalOrganization, name: Microsoft,   orgName: Microsoft }
  - { id: org-cerebras,   type: ExternalOrganization, name: Cerebras,    orgName: Cerebras }
  - { id: org-openai,     type: ExternalOrganization, name: OpenAI,      orgName: OpenAI }
  - { id: org-google,     type: ExternalOrganization, name: Google,      orgName: Google }
  - { id: org-cloudflare, type: ExternalOrganization, name: Cloudflare,  orgName: Cloudflare }
  - { id: org-postman,    type: ExternalOrganization, name: Postman,     orgName: Postman }

armies:
  - { id: army-claude,  type: Army, name: "Claude Code army",     evolutionStage: Custom }
  - { id: army-copilot, type: Army, name: "GitHub Copilot army",  evolutionStage: Product }

capabilities:
  - { id: cap-ontology,      type: Capability, name: "Ontology pipeline / digital twin", level: L1, evolutionStage: Genesis }
  - { id: cap-llm-gw,        type: Capability, name: "LLM gateway & model routing",      level: L1, evolutionStage: Custom }
  - { id: cap-agent-orch,    type: Capability, name: "Agent orchestration (two armies)", level: L0, evolutionStage: Custom }
  - { id: cap-contract,      type: Capability, name: "Contract-first integration",       level: L1, evolutionStage: Custom }
  - { id: cap-knowledge,     type: Capability, name: "Knowledge graph",                  level: L1, evolutionStage: Genesis }
  - { id: cap-secrets,       type: Capability, name: "Credentials & secrets brokering",  level: L2, evolutionStage: Product }
  - { id: cap-observability, type: Capability, name: "Observability",                    level: L2, evolutionStage: Product }
  - { id: cap-event-mesh,    type: Capability, name: "Event mesh",                       level: L1, evolutionStage: Product }
  - { id: cap-forge,         type: Capability, name: "Forge — materialize ontology → Object Model", level: L2, evolutionStage: Genesis }
  - { id: cap-refine,        type: Capability, name: "Refine — snap JSON → typed fragments",        level: L2, evolutionStage: Genesis }
  - { id: cap-registry,      type: Capability, name: "Registry — ingest / assay / bridge ontologies", level: L2, evolutionStage: Genesis }
  - { id: cap-swarm,         type: Capability, name: "Swarm synthesis — assemble agents + evidence-grounded answers", level: L1, evolutionStage: Genesis }
  - { id: cap-uda,           type: Capability, name: "Universal Data Adapter — serve the Object Model from the optimal backend", level: L1, evolutionStage: Genesis }
  - { id: cap-sieve,         type: Capability, name: "Ontology conformance sieve (SHACL gate)",     level: L2, evolutionStage: Genesis }

# UX surfaces — the spaces you interface a capability through (untool product ontology §3).
surfaces:
  - { id: srf-crucible,      type: Surface, name: "Crucible",      evolutionStage: Genesis }
  - { id: srf-refinery,      type: Surface, name: "Refinery",      evolutionStage: Genesis }
  - { id: srf-registry,      type: Surface, name: "Registry",      evolutionStage: Genesis }
  - { id: srf-workspace,     type: Surface, name: "Workspace",     evolutionStage: Genesis }
  - { id: srf-fleet-console, type: Surface, name: "Fleet Console", evolutionStage: Custom }

decisions:
  - { id: adr-002, type: ArchitecturalDecision, number: "002", title: "JWT-forwarding auth contract", decisionStatus: Accepted }
  - { id: adr-005, type: ArchitecturalDecision, number: "005", title: "backend-core OpenAPI contract", decisionStatus: Accepted }
  - { id: adr-009, type: ArchitecturalDecision, number: "009", title: "Canonical data model (Arrow)", decisionStatus: Accepted }
  - { id: adr-016, type: ArchitecturalDecision, number: "016", title: "Ontology representation: reification & hyperedges", decisionStatus: Accepted }
  - { id: adr-019, type: ArchitecturalDecision, number: "019", title: "Ontology reasoning layer", decisionStatus: Accepted }
  - { id: adr-023, type: ArchitecturalDecision, number: "023", title: "Container tiering strategy", decisionStatus: Accepted }
  - { id: adr-029, type: ArchitecturalDecision, number: "029", title: "agentarmy-forge codegen container", decisionStatus: Accepted }
  - { id: adr-030, type: ArchitecturalDecision, number: "030", title: "Data-to-ontology ingestion pipeline", decisionStatus: Accepted }
  - { id: adr-032, type: ArchitecturalDecision, number: "032", title: "Ontology sift-sort authoring loop", decisionStatus: Accepted }
  - { id: adr-033, type: ArchitecturalDecision, number: "033", title: "F# ontology compiler core", decisionStatus: Accepted }

releasetrains:
  - { id: rt5, type: ReleaseTrain, trainId: RT5, theme: "Ontology-grade persistence" }
  - { id: rt6, type: ReleaseTrain, trainId: RT6, theme: "backend-core UDA" }
  - { id: rt7, type: ReleaseTrain, trainId: RT7, theme: "middle-core runtime" }

# --- Relator instances (n-ary, hyperedge-as-vertex) ---------------------------
contract-binding:
  - { id: cb-data-api,   producer: repo-backend-core, consumers: [repo-frontend-core, repo-middle-core], contract: con-data-api,      status: Shipped,  governingAdr: ARC-ADR-005, test: "Pact provider/consumer" }
  - { id: cb-model,      producer: repo-middle-core,  consumers: [repo-middle-core],                      contract: con-model,         status: Shipped,  governingAdr: "—",         test: "check_drift.py" }
  - { id: cb-data-plat,  producer: repo-middle-core,  consumers: [repo-backend-core],                     contract: con-data-platform, status: Shipped,  governingAdr: ARC-ADR-009, test: "provider conformance" }
  - { id: cb-jwt,        producer: repo-agentarmy,    consumers: [repo-frontend-core, repo-middle-core, repo-backend-core], contract: con-jwt-auth, status: Proposed, governingAdr: ARC-ADR-002, test: "auth integration (to wire)" }
  - { id: cb-copilotkit, producer: repo-middle-core,  consumers: [repo-frontend-core],                    contract: con-copilotkit,    status: Proposed, governingAdr: ARC-ADR-003, test: "to wire" }
  - { id: cb-mcr-f4,     producer: repo-middle-core,  consumers: [repo-backend-core],                     contract: con-mcr-f4,        status: Shipped,  governingAdr: ARC-ADR-016, test: "to wire (#76)" }
  - { id: cb-bff,        producer: repo-frontend-core, consumers: [repo-frontend-core],                   contract: con-bff,           status: Shipped,  governingAdr: ARC-ADR-002, test: "openapi-fetch client" }
  - { id: cb-agui,       producer: repo-middle-core,  consumers: [repo-frontend-core],                    contract: con-agui,          status: Proposed, governingAdr: ARC-ADR-007, test: "SSE governance" }
  - { id: cb-llm-gw,     producer: repo-backend-core, consumers: [repo-middle-core, repo-frontend-core],  contract: con-llm-gw,        status: Proposed, governingAdr: ARC-ADR-021, test: "provider verification" }
  - { id: cb-agent-gw,   producer: repo-backend-core, consumers: [repo-middle-core, repo-frontend-core],  contract: con-agent-gw,      status: Shipped,  governingAdr: ARC-ADR-028, test: "consumer pact (pending)" }
  - { id: cb-event-bus,  producer: repo-middle-core,  consumers: [repo-backend-core, repo-frontend-core], contract: con-event-bus,     status: Proposed, governingAdr: ARC-ADR-022, test: "push-consumer + DLQ" }
  - { id: cb-webhook,    producer: repo-agentarmy,    consumers: [repo-middle-core],                      contract: con-webhook,       status: Proposed, governingAdr: ARC-ADR-022, test: "doctor (HMAC + replay)" }
  - { id: cb-runbook,    producer: repo-agentarmy,    consumers: [repo-backend-core, repo-middle-core],   contract: con-runbook,       status: Proposed, governingAdr: ARC-ADR-031, test: "doctor (event-fires-runbook)" }
  - { id: cb-fleet-vocab, producer: repo-backend-core, consumers: [repo-backend-core, repo-middle-core, repo-frontend-core], contract: con-fleet-vocab, status: Shipped, governingAdr: ARC-ADR-032, test: "/ontology/abstract" }

deployment:
  - { id: dep-arcadedb,  deployed: ctr-arcadedb,    onto: plat-aca, environment: dev }
  - { id: dep-fuseki,    deployed: ctr-fuseki,      onto: plat-aca, environment: dev }
  - { id: dep-backend,   deployed: ctr-backend,     onto: plat-aca, environment: dev }
  - { id: dep-forge,     deployed: ctr-forge,       onto: plat-aca, environment: dev }
  - { id: dep-event-bridge, deployed: ctr-event-bridge, onto: plat-aca, environment: dev }
  - { id: dep-runbook,   deployed: ctr-runbook,     onto: plat-aca, environment: dev }
  - { id: dep-llm-gw,    deployed: ctr-llm-gw,      onto: plat-aca, environment: dev }
  - { id: dep-creds,     deployed: ctr-creds,       onto: plat-keyvault, environment: dev }

governed-by-decision:
  - { id: gbd-016, decision: adr-016, governs: [ctr-arcadedb, con-mcr-f4, cap-knowledge] }
  - { id: gbd-023, decision: adr-023, governs: [ctr-arcadedb, ctr-backend, ctr-event-bridge] }
  - { id: gbd-005, decision: adr-005, governs: [con-data-api] }
  - { id: gbd-002, decision: adr-002, governs: [con-jwt-auth, con-bff] }
  - { id: gbd-029, decision: adr-029, governs: [ctr-forge] }
  - { id: gbd-032, decision: adr-032, governs: [con-fleet-vocab, cap-ontology] }
  - { id: gbd-009, decision: adr-009, governs: [con-data-platform, con-mcr-f4] }

partner-engagement:
  - { id: pe-anthropic,  partner: org-anthropic,  regarding: [cap-llm-gw, cap-agent-orch],   nature: "LLM provider (Claude)" }
  - { id: pe-microsoft,  partner: org-microsoft,  regarding: [plat-aca, plat-keyvault, plat-github, cap-knowledge], nature: "infra + VCS + BFO/IKW-GraphEngine interop" }
  - { id: pe-cerebras,   partner: org-cerebras,   regarding: [cap-ontology, cap-llm-gw],      nature: "inference (sift proposer)" }
  - { id: pe-openai,     partner: org-openai,     regarding: [cap-llm-gw],                    nature: "LLM provider (fallback)" }
  - { id: pe-google,     partner: org-google,     regarding: [plat-gcp],                      nature: "infra (fallback compute)" }
  - { id: pe-cloudflare, partner: org-cloudflare, regarding: [plat-cf],                       nature: "edge / zero-trust access" }
  - { id: pe-postman,    partner: org-postman,    regarding: [cap-contract],                  nature: "contract mocking & distribution" }

# capability realisation — wires capabilities to the repos/containers/platforms/armies that realise them
capability-realization:
  - { id: cr-ontology,      capability: cap-ontology,      realizedBy: [ctr-fuseki, ctr-arcadedb, plat-arcadedb, plat-fuseki, repo-backend-core] }
  - { id: cr-knowledge,     capability: cap-knowledge,     realizedBy: [plat-arcadedb, ctr-arcadedb, plat-postgres] }
  - { id: cr-llm,           capability: cap-llm-gw,        realizedBy: [ctr-llm-gw, repo-backend-core] }
  - { id: cr-agent,         capability: cap-agent-orch,    realizedBy: [army-claude, army-copilot, repo-agentarmy] }
  - { id: cr-contract,      capability: cap-contract,      realizedBy: [plat-postman, repo-agentarmy] }
  - { id: cr-secrets,       capability: cap-secrets,       realizedBy: [ctr-creds, plat-keyvault] }
  - { id: cr-observability, capability: cap-observability, realizedBy: [ctr-otel] }
  - { id: cr-event-mesh,    capability: cap-event-mesh,    realizedBy: [plat-nats, ctr-event-bridge] }
  - { id: cr-forge,         capability: cap-forge,         realizedBy: [ctr-forge, repo-forge] }
  - { id: cr-refine,        capability: cap-refine,        realizedBy: [ctr-abstraction, repo-backend-core] }
  - { id: cr-registry,      capability: cap-registry,      realizedBy: [ctr-fuseki, repo-backend-core] }
  - { id: cr-swarm,         capability: cap-swarm,         realizedBy: [army-claude, army-copilot, repo-agentarmy] }
  - { id: cr-uda,           capability: cap-uda,           realizedBy: [repo-backend-core] }
  - { id: cr-sieve,         capability: cap-sieve,         realizedBy: [ctr-fuseki] }

# capability exposure — wires UX surfaces to the capabilities they front (surface = space, capability = verb)
capability-exposure:
  - { id: ce-crucible, surface: srf-crucible,      exposes: [cap-ontology, cap-forge] }
  - { id: ce-refinery, surface: srf-refinery,      exposes: [cap-refine] }
  - { id: ce-registry, surface: srf-registry,      exposes: [cap-registry] }
  - { id: ce-workspace, surface: srf-workspace,    exposes: [cap-swarm, cap-knowledge] }
  - { id: ce-fleet,    surface: srf-fleet-console, exposes: [cap-observability, cap-agent-orch] }

# release delivery — wires release trains to what they deliver
release-delivery:
  - { id: rd-rt5, train: rt5, delivers: [cap-ontology, cap-knowledge, ctr-fuseki] }
  - { id: rd-rt6, train: rt6, delivers: [cap-contract, repo-backend-core] }
  - { id: rd-rt7, train: rt7, delivers: [repo-middle-core] }
