# =============================================================================
# AgentArmy Platform Self-Model — the system describing itself.
#
# T-Box (schema) for a digital twin of the AgentArmy fleet: repos, contracts,
# containers, platforms, partners, agents, decisions, and how they bind.
# Authored directly (not document-sifted) because the architecture is KNOWN —
# this is hand-authored structural knowledge, the direct-authoring path of the
# ontology pipeline (docs/ontology-pipeline.md), not the Cerebras sift loop.
#
# Validates against ../../../templates/ontology-project/ontology.ir.schema.json
# (validation Level 1). Foundation: UFO/gUFO primary, BFO/CCO interop sidecar.
# The n-ary facts (who-produces-what-for-whom) are reified as relators
# (hyperedge-as-vertex, ARC-ADR-016). EvolutionStage on SystemComponent is the
# Wardley hook — the map becomes a projection of this graph, not a redraw.
# =============================================================================
ontology:
  id: agentarmy-platform-self-model
  version: 0.1.0
  foundation: UFO/gUFO
  default_namespace: https://agentarmy.dev/self#
  imports:
    - { prefix: gufo, uri: "http://purl.org/nemo/gufo#" }
    - { prefix: prov, uri: "http://www.w3.org/ns/prov#" }
    - { prefix: time, uri: "http://www.w3.org/2006/time#" }
    - { prefix: cco,  uri: "https://www.commoncoreontologies.org/" }
    - { prefix: obo,  uri: "http://purl.obolibrary.org/obo/" }

# -----------------------------------------------------------------------------
# Enumerations (controlled vocabularies — taxonomist layer)
# -----------------------------------------------------------------------------
types:
  - id: EvolutionStage
    stereotype: enumeration
    description: "Wardley evolution axis — how industrialised a component is."
    literals: [Genesis, Custom, Product, Commodity]

  - id: RepoRole
    stereotype: enumeration
    description: "A repository's role in the hub-and-spoke template model."
    literals: [Hub, Spoke]

  - id: ContainerTier
    stereotype: enumeration
    description: "Container tier per ARC-ADR-023 (rigid: exactly one tier each)."
    literals: [Platform, Application, Function]

  - id: ContractFormat
    stereotype: enumeration
    description: "The wire form a contract is expressed in."
    literals: [OpenAPI, AsyncAPI, GraphQL, SharedTypes, JSON_Schema, RDF_OWL, HTTP_Header]

  - id: ContractStatus
    stereotype: enumeration
    description: "Lifecycle phase of a contract (a phase partition, modelled as a value here)."
    literals: [Proposed, Shipped, Deprecated]

  - id: DecisionStatus
    stereotype: enumeration
    description: "MADR status of an architecture decision."
    literals: [Proposed, Accepted, Deprecated, Superseded]

  - id: PlatformKind
    stereotype: enumeration
    description: "What class of external platform/service this is."
    literals: [Cloud, GraphDB, Triplestore, Broker, RelationalDB, SecretStore, APITooling, EdgeCDN, VCSHost, LLMProvider]

  # ---------------------------------------------------------------------------
  # Category — the rigid non-sortal supertype that carries Wardley positioning.
  # Anything that lives on the value chain / evolution axis is a SystemComponent.
  # ---------------------------------------------------------------------------
  - id: SystemComponent
    stereotype: category
    rigidity: rigid
    gufo_type: gufo:Category
    description: "An identifiable element of the platform that can be positioned on a value chain and an evolution axis."
    properties:
      - { id: name, range: string, cardinality: "1..1" }
      - { id: evolutionStage, range: EvolutionStage, cardinality: "0..1", description: "Wardley stage — drives the map projection." }
      - { id: valueChainDepth, range: integer, cardinality: "0..1", description: "Distance from the user-visible need (0 = visible)." }

  # ---------------------------------------------------------------------------
  # Kinds (rigid sortals with their own identity) + subkinds
  # ---------------------------------------------------------------------------
  - id: Repository
    stereotype: kind
    parent: SystemComponent
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    bfo_class: obo:IAO_0000030   # information content entity (a code corpus)
    description: "A version-controlled code corpus that is independently deployable or templated."
    properties:
      - { id: repoRole, range: RepoRole, cardinality: "1..1" }
      - { id: layer, range: string, cardinality: "0..1", description: "Architectural layer for a spoke (ui/middle/data/forge)." }
      - { id: primaryLanguage, range: string, cardinality: "0..1" }

  - id: HubRepository
    stereotype: subkind
    parent: Repository
    identity: inherited
    rigidity: rigid
    gufo_type: gufo:SubKind
    description: "The template/orchestration repository that owns the inter-layer contract surface and the platform tier."

  - id: SpokeRepository
    stereotype: subkind
    parent: Repository
    identity: inherited
    rigidity: rigid
    gufo_type: gufo:SubKind
    description: "A layer repository generated from the hub that implements one layer of the system."

  - id: Container
    stereotype: kind
    parent: SystemComponent
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    description: "A deployable image belonging to exactly one tier (ARC-ADR-023)."
    properties:
      - { id: tier, range: ContainerTier, cardinality: "1..1" }
      - { id: deployTarget, range: string, cardinality: "0..1", description: "e.g. aca (Azure Container Apps)." }
      - { id: proves, range: string, cardinality: "0..1", description: "The image-doctor checks it proves." }

  - id: PlatformContainer
    stereotype: subkind
    parent: Container
    identity: inherited
    rigidity: rigid
    gufo_type: gufo:SubKind
    description: "Stateful, slow-lifecycle container (database, broker, triplestore)."

  - id: ApplicationContainer
    stereotype: subkind
    parent: Container
    identity: inherited
    rigidity: rigid
    gufo_type: gufo:SubKind
    description: "Stateless one-per-spoke application container with rolling deploys."

  - id: FunctionContainer
    stereotype: subkind
    parent: Container
    identity: inherited
    rigidity: rigid
    gufo_type: gufo:SubKind
    description: "Small, stateless, independently rolled-out single-purpose container."

  - id: Contract
    stereotype: kind
    parent: SystemComponent
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    bfo_class: obo:IAO_0000030   # information content entity (a specification)
    description: "A versioned inter-layer interface specification a producer publishes and consumers bind to."
    properties:
      - { id: format, range: ContractFormat, cardinality: "1..1" }
      - { id: status, range: ContractStatus, cardinality: "1..1" }
      - { id: governingAdr, range: string, cardinality: "0..1" }

  - id: Platform
    stereotype: kind
    parent: SystemComponent
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    description: "An external infrastructure or SaaS capability the fleet runs on or calls."
    properties:
      - { id: platformKind, range: PlatformKind, cardinality: "1..1" }
      - { id: vendor, range: string, cardinality: "0..1" }

  - id: ExternalOrganization
    stereotype: kind
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    bfo_class: cco:Organization
    description: "An external organization the project depends on, partners with, or integrates."
    properties:
      - { id: orgName, range: string, cardinality: "1..1" }

  - id: Agent
    stereotype: kind
    parent: SystemComponent
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    description: "A specialist AI agent definition that performs scoped work in the fleet."
    properties:
      - { id: category, range: string, cardinality: "0..1" }

  - id: Army
    stereotype: kind
    parent: SystemComponent
    identity: collective
    rigidity: rigid
    gufo_type: gufo:Kind
    description: "A coordinated collective of agents operating under one execution model (Claude Code or Copilot)."

  - id: ArchitecturalDecision
    stereotype: kind
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    bfo_class: obo:IAO_0000030
    description: "A recorded architecture decision (ADR) that fixes a design choice and its consequences."
    properties:
      - { id: number, range: string, cardinality: "1..1" }
      - { id: title, range: string, cardinality: "1..1" }
      - { id: decisionStatus, range: DecisionStatus, cardinality: "1..1" }

  - id: Capability
    stereotype: kind
    parent: SystemComponent
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    description: "A business/platform capability the system provides, independent of how it is implemented."
    properties:
      - { id: level, range: string, cardinality: "0..1", description: "Capability-map level (L0/L1/L2)." }

  - id: ReleaseTrain
    stereotype: kind
    identity: functional-complex
    rigidity: rigid
    gufo_type: gufo:Kind
    description: "A SAFE release train: a strategic theme grouping features over program increments."
    properties:
      - { id: trainId, range: string, cardinality: "1..1" }
      - { id: theme, range: string, cardinality: "0..1" }

  # ---------------------------------------------------------------------------
  # Roles (anti-rigid, relational — what a thing IS while participating)
  # ---------------------------------------------------------------------------
  - id: Producer
    stereotype: role
    parent: Repository
    identity: inherited
    rigidity: anti-rigid
    gufo_type: gufo:Role
    description: "A repository in its capacity as the publisher of a contract."

  - id: Consumer
    stereotype: role
    parent: Repository
    identity: inherited
    rigidity: anti-rigid
    gufo_type: gufo:Role
    description: "A repository in its capacity as a binder/caller of a contract it does not own."

  - id: Partner
    stereotype: role
    parent: ExternalOrganization
    identity: inherited
    rigidity: anti-rigid
    gufo_type: gufo:Role
    description: "An external organization in its capacity as a strategic collaborator (not merely a vendor)."

# -----------------------------------------------------------------------------
# Relators — n-ary facts reified as first-class vertices (ARC-ADR-016).
# These are the high-value edges: the integration web, deployment, governance.
# -----------------------------------------------------------------------------
relators:
  - id: contract-binding
    stereotype: relator
    description: "Reifies that a producer repo publishes a contract that one or more consumer repos bind to, with a status over time. The typed form of docs/contracts.md."
    roles:
      - { name: producer,  participant_type: Producer,  cardinality: "1..1", description: "The repo that owns/publishes the contract." }
      - { name: consumers, participant_type: Consumer,  cardinality: "1..*", description: "The repos that bind to it." }
      - { name: contract,  participant_type: Contract,  cardinality: "1..1", description: "The interface being bound." }
    properties:
      - { id: status, range: ContractStatus, cardinality: "1..1" }
      - { id: governingAdr, range: string, cardinality: "0..1" }
      - { id: test, range: string, cardinality: "0..1", description: "The provider/consumer test that enforces it." }
    temporal: { valid_from: validFrom, valid_to: validTo, recorded_at: recordedAt }
    bfo_pattern: interdependent-roles
    provenance: { source: "docs/contracts.md", generated_by: "self-model", recorded_at: "2026-05-30T00:00:00Z" }

  - id: deployment
    stereotype: relator
    description: "Reifies that a container is deployed onto a platform in an environment."
    roles:
      - { name: deployed,  participant_type: Container, cardinality: "1..1" }
      - { name: onto,      participant_type: Platform,  cardinality: "1..1" }
    properties:
      - { id: environment, range: string, cardinality: "0..1", description: "dev/staging/prod." }
    temporal: { valid_from: validFrom, valid_to: validTo, recorded_at: recordedAt }
    bfo_pattern: interdependent-roles
    provenance: { source: "templates/**/image.json", generated_by: "self-model", recorded_at: "2026-05-30T00:00:00Z" }

  - id: governed-by-decision
    stereotype: relator
    description: "Reifies that an architecture decision governs one or more system components (its blast radius)."
    roles:
      - { name: decision, participant_type: ArchitecturalDecision, cardinality: "1..1" }
      - { name: governs,  participant_type: SystemComponent,       cardinality: "1..*" }
    bfo_pattern: interdependent-roles
    provenance: { source: "docs/decisions/", generated_by: "self-model", recorded_at: "2026-05-30T00:00:00Z" }

  - id: partner-engagement
    stereotype: relator
    description: "Reifies that an external organization partners with the project regarding a platform/capability, optionally via a contract."
    roles:
      - { name: partner,   participant_type: Partner,         cardinality: "1..1" }
      - { name: regarding, participant_type: SystemComponent, cardinality: "1..*", description: "The platform(s)/capability the partnership concerns." }
    properties:
      - { id: nature, range: string, cardinality: "0..1", description: "e.g. LLM-provider, infra, inference, design." }
    provenance: { source: "CLAUDE.md + contracts.md upstream", generated_by: "self-model", recorded_at: "2026-05-30T00:00:00Z" }

  - id: capability-realization
    stereotype: relator
    description: "Reifies that a platform capability is realised by one or more system components (repos, containers, platforms, armies)."
    roles:
      - { name: capability, participant_type: Capability,      cardinality: "1..1" }
      - { name: realizedBy, participant_type: SystemComponent, cardinality: "1..*" }
    bfo_pattern: interdependent-roles
    provenance: { source: "self-model", generated_by: "self-model", recorded_at: "2026-05-30T00:00:00Z" }

  - id: release-delivery
    stereotype: relator
    description: "Reifies that a SAFE release train delivers one or more system components (capabilities, repos, contracts)."
    roles:
      - { name: train,    participant_type: ReleaseTrain,    cardinality: "1..1" }
      - { name: delivers, participant_type: SystemComponent, cardinality: "1..*" }
    bfo_pattern: interdependent-roles
    provenance: { source: "planning/release-trains", generated_by: "self-model", recorded_at: "2026-05-30T00:00:00Z" }

# -----------------------------------------------------------------------------
# Non-reified relations (material ones derive from the relators above)
# -----------------------------------------------------------------------------
relations:
  - id: produces
    stereotype: material
    source: Repository
    target: Contract
    derived_from: contract-binding
    source_cardinality: "1..1"
    target_cardinality: "0..*"
  - id: consumes
    stereotype: material
    source: Repository
    target: Contract
    derived_from: contract-binding
    source_cardinality: "0..*"
    target_cardinality: "0..*"
  - id: container-of
    stereotype: componentOf
    source: Container
    target: Repository
    source_cardinality: "0..*"
    target_cardinality: "0..1"
  - id: realises
    stereotype: material
    source: Repository
    target: Capability
    source_cardinality: "0..*"
    target_cardinality: "0..*"

# -----------------------------------------------------------------------------
# Constraints (each prover proves a different thing — Levels 4/6)
# -----------------------------------------------------------------------------
constraints:
  - id: binding-has-one-producer
    language: shacl
    severity: violation
    target: contract-binding
    expression: "Every contract-binding must bind exactly one producer and exactly one contract (closed-world)."
  - id: binding-has-consumer
    language: shacl
    severity: warning
    target: contract-binding
    expression: "A shipped contract-binding should bind at least one consumer (an unconsumed shipped contract is a smell)."
  - id: container-single-tier
    language: shacl
    severity: violation
    target: Container
    expression: "Every Container has exactly one tier (Platform | Application | Function) — ARC-ADR-023."
  - id: deployment-window-ordered
    language: smt
    severity: violation
    target: deployment
    expression: "validFrom < validTo for any closed deployment window."

# -----------------------------------------------------------------------------
# Projections — one model, many outputs (never collapse them)
# -----------------------------------------------------------------------------
projections:
  gufo: true
  bfo_cco: true
  owl: true
  shacl: true
  alloy: false
  smt: false
  csharp: true
  arcadedb: true
  prov: true
  dlt_anchor: false
