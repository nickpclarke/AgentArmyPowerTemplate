openapi: 3.1.0
info:
  title: AgentArmy Problem Details (RFC 7807)
  version: 0.1.0
  description: >-
    Single canonical error-envelope contract for the entire fleet. Every layer's
    OpenAPI spec should `$ref` this `ProblemDetails` schema for its non-2xx
    responses instead of inventing its own error shape. Without it, frontend-core
    handles three different error shapes (BE Python's `{detail: [...]}`, BE
    Rust's `{error: {code, message}}`, MC's CopilotKit `{type, message}`), and
    every consumer has to write per-layer error parsers.

    This is the IETF standard [RFC 7807 — Problem Details for HTTP APIs] with
    AgentArmy-specific extension fields. The media type is
    `application/problem+json`. Every problem MUST set `type`, `title`, and
    `status`; the rest are SHOULD/MAY per the RFC.

    AgentArmy extensions (additive; clients SHOULD ignore unknown fields):

    - `code` — stable, short, machine-readable identifier (e.g.
      `agent-not-found`, `rate-limit-exceeded`, `validation-failed`). Use this
      for client-side branching; `title` is for humans.
    - `trace_id` — W3C trace-context trace id of the failing request (per
      ARC-ADR-010 / ARC-ADR-024). Lets ops correlate the error to OTel spans.
    - `dependencies` — for readiness/health failures, an array of
      per-dependency `{name, ok, message}` snapshots (see
      `contracts/health.openapi.yaml`).
    - `validation_errors` — for `status: 422` Pydantic-style validation
      failures, an array of `{loc, msg, type}` consistent with FastAPI's
      default shape, so backend-core's existing 422s migrate cleanly.

    Realizes the error-envelope row in `docs/contracts.md` Backlog (XC-3).
  contact:
    name: AgentArmy hub
    url: https://github.com/nickpclarke/AgentArmy

# This document defines reusable components only — no paths.
# Other specs reference the schemas here via:
#   $ref: 'https://raw.githubusercontent.com/nickpclarke/AgentArmy/main/contracts/problem-details.openapi.yaml#/components/schemas/ProblemDetails'
# or via a relative file ref when vendored.

paths: {}

components:
  schemas:
    ProblemDetails:
      description: >-
        RFC 7807 Problem Details object with AgentArmy extensions. Returned
        as `application/problem+json` for any non-2xx response. `type` is a
        URI that uniquely identifies the problem class (dereferenceable docs
        live at that URI). `code` is the short stable id consumers branch on.
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: >-
            Absolute URI uniquely identifying the problem class. SHOULD resolve
            to human-readable docs. For AgentArmy errors use the canonical form
            `https://github.com/nickpclarke/AgentArmy/contracts/problems/<code>`.
          example: "https://github.com/nickpclarke/AgentArmy/contracts/problems/agent-not-found"
        title:
          type: string
          description: Short, human-readable summary. Does not change between occurrences.
          example: "Agent not found"
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code generated by the origin server.
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: "No agent registered with slug 'github-mcp'."
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying the specific occurrence of the problem.
          example: "/a2a/v1/agents/github-mcp"

        # ---- AgentArmy extensions ----
        code:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,63}$'
          description: >-
            Stable, machine-readable identifier. Use for client-side branching.
            Kebab-case, short, doesn't change across versions.
          example: "agent-not-found"
        trace_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: >-
            W3C trace-context trace id of the failing request. Lets ops
            correlate the error to OTel spans in Tempo/Honeycomb/etc.
          example: "4bf92f3577b34da6a3ce929d0e0e4736"
        dependencies:
          type: array
          description: >-
            For 503 readiness/health failures only — per-dependency snapshot
            of what was up/down at the time of the failure. Refs the schema
            in `contracts/health.openapi.yaml`.
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              message: { type: string }
        validation_errors:
          type: array
          description: >-
            For 422 validation failures only — Pydantic-style per-field
            errors. Matches FastAPI's default 422 detail shape so backend-core
            migrations are mechanical.
          items:
            $ref: '#/components/schemas/ValidationError'
      example:
        type: "https://github.com/nickpclarke/AgentArmy/contracts/problems/rate-limit-exceeded"
        title: "Too Many Requests"
        status: 429
        detail: "Per-token request limit (60/min) exceeded; retry after 17s."
        code: "rate-limit-exceeded"
        trace_id: "4bf92f3577b34da6a3ce929d0e0e4736"
        instance: "/api/v1/chat/completions"

    ValidationError:
      type: object
      description: One Pydantic-style validation failure entry.
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          description: Path to the offending field (e.g. ["body", "messages", 0, "content"]).
          items:
            oneOf:
              - { type: string }
              - { type: integer }
        msg:
          type: string
          description: Human-readable validation message.
          example: "Field required"
        type:
          type: string
          description: Error type code from the validator.
          example: "missing"
        ctx:
          type: object
          additionalProperties: true
          description: Validator-specific context (e.g. limits, expected values).
        input:
          description: The offending input value, when including it is safe.

  responses:
    # Convenience response objects spec authors can $ref directly.
    BadRequest:
      description: Bad request — request body or parameters are malformed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Unauthorized:
      description: Unauthorized — missing or invalid authentication credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Forbidden:
      description: Forbidden — authenticated but lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    NotFound:
      description: Not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Conflict:
      description: Conflict with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    UnprocessableEntity:
      description: Validation failed — body shape was valid JSON but contents are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    TooManyRequests:
      description: Rate-limit exceeded. Includes Retry-After header.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds the client should wait before retrying.
        X-RateLimit-Limit:
          schema: { type: integer }
          description: Total request budget for the current window.
        X-RateLimit-Remaining:
          schema: { type: integer }
          description: Remaining requests in the current window.
        X-RateLimit-Reset:
          schema: { type: integer }
          description: Epoch seconds when the window resets.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    ServiceUnavailable:
      description: Service temporarily unavailable — typically a dependency is down.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
