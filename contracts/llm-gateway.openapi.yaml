openapi: 3.1.0
info:
  title: AgentArmy LLM Gateway
  version: 0.1.0
  description: >-
    Internal, provider-agnostic gateway for chat completions, embeddings, and
    model discovery. Deliberately **OpenAI-compatible** (Chat Completions API)
    so any layer can use the OpenAI SDK / openai-fetch unchanged, while the
    gateway hides the real provider (OpenAI, Cerebras [ARC-ADR-004], Azure
    Foundry, or a local OpenAI-compatible server e.g. Ollama/vLLM/LM Studio).
    Anthropic/Claude is supported via an adapter: its native Messages API is NOT
    OpenAI-shaped (system is a top-level param, max_tokens required, content
    blocks, different SSE events), so the gateway translates OpenAI<->Messages for
    claude-* models (reachable via the Anthropic API directly, or Bedrock/Vertex).
    Claude-only features (extended thinking, prompt caching, citations) don't map
    to chat-completions — add a native passthrough if the platform needs them.

    Why a gateway contract:
    - Provider swap without touching middle-core / frontend-core.
    - Keys live ONLY in the gateway — the browser never holds an LLM key
      (ARC-ADR-003). Callers forward the user JWT (ARC-ADR-002); the gateway
      attaches the provider key server-side.
    - One choke point for rate-limiting, cost, and observability.

    Streaming note: `stream: true` returns Server-Sent Events
    (`text/event-stream`) — a sequence of `data: <ChatCompletionChunk>` lines
    terminated by `data: [DONE]`. OpenAPI cannot fully model an SSE stream, so
    the streamed media type is described as a string and the per-event payload
    is the `ChatCompletionChunk` schema below. Distinct from the higher-level
    AG-UI agent-run stream (agui-stream.asyncapi.yaml, ARC-ADR-007).

    SSE event taxonomy (when `stream: true`):

    1. **Content chunks** — `data: <ChatCompletionChunk>` lines carrying token
       deltas via `choices[].delta.content` (incremental assistant text).
    2. **Tool-call deltas** — same `ChatCompletionChunk` shape, but
       `choices[].delta.tool_calls[]` is populated with index + id + name +
       arguments-fragment. OpenAI streams tool-call arguments token-by-token,
       so consumers must JSON-string-concat across deltas before parsing.
    3. **Usage event (terminal)** — emitted iff
       `request.stream_options.include_usage = true`. A `ChatCompletionChunk`
       with `choices: []` and a populated `usage` object. Sent BEFORE `[DONE]`
       so consumers see token accounting even when streams are cancelled at
       the network boundary.
    4. **Error event (terminal)** — for mid-stream provider failures the
       gateway emits a single `data: <StreamError>` (problem-details-shaped)
       and closes the stream WITHOUT sending `[DONE]`. Consumers MUST treat
       any `data:` line whose JSON contains a `type` field starting with
       `https://github.com/nickpclarke/AgentArmy/contracts/problems/` as a
       fatal stream error.
    5. **Stream terminator** — `data: [DONE]` (literal). The only line that
       isn't parseable as JSON.

    Error envelope: all 4xx/5xx responses use
    `application/problem+json` referencing
    `contracts/problem-details.openapi.yaml`. Mid-stream errors use the same
    shape inline in the SSE.

    STATUS: proposed (ARC-ADR-021). Producer/placement TBD by that ADR; on
    acceptance this spec relocates to the chosen producer repo and the server
    URL is finalized.
servers:
  - url: "{LLM_GATEWAY_URL}"
    description: Host-only base (no /v1 suffix — paths carry it) so generated clients/mocks don't double the prefix.
    variables:
      LLM_GATEWAY_URL:
        default: http://localhost:8081
security:
  - bearerAuth: []
paths:
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion (streaming or not)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: >-
            Non-streaming: a single ChatCompletionResponse (application/json).
            Streaming (`stream: true`): text/event-stream of `data: <ChatCompletionChunk>`
            lines ending with `data: [DONE]`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletionResponse" }
            text/event-stream:
              schema:
                type: string
                description: SSE stream; each event's data is a ChatCompletionChunk (JSON), final line is `[DONE]`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/embeddings:
    post:
      operationId: createEmbedding
      summary: Create embeddings (OpenAI-compatible)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingRequest" }
      responses:
        "200":
          description: Embedding vectors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/models:
    get:
      operationId: listModels
      summary: List the models the gateway exposes
      responses:
        "200":
          description: Available models.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The caller's user JWT (forwarded per ARC-ADR-002). The provider key is attached server-side by the gateway and is never exposed to callers.
  responses:
    Unauthorized:
      description: Missing/invalid JWT.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Rate or quota limit hit.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Malformed request.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content: { type: string }
        name: { type: string }
        tool_call_id: { type: string }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: "Logical model id (the gateway maps it to a provider/model)." }
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        stream: { type: boolean, default: false, description: "true → SSE stream of ChatCompletionChunk." }
        stream_options:
          type: object
          description: Streaming-only options. Ignored when `stream: false`.
          properties:
            include_usage:
              type: boolean
              default: false
              description: >-
                When true, the gateway emits one terminal `ChatCompletionChunk`
                with `choices: []` and a populated `usage` object right BEFORE
                the `[DONE]` terminator. Required to bill streaming requests.
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, minimum: 1 }
        top_p: { type: number }
        stop:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true, description: "Pass-through tags for cost/observability (caller, tenant, agent)." }
    Choice:
      type: object
      properties:
        index: { type: integer }
        message: { $ref: "#/components/schemas/ChatMessage" }
        finish_reason: { type: string, enum: [stop, length, content_filter, tool_calls, null] }
    Usage:
      type: object
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
    ChatCompletionResponse:
      type: object
      required: [id, object, model, choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items: { $ref: "#/components/schemas/Choice" }
        usage: { $ref: "#/components/schemas/Usage" }
    ToolCallDelta:
      type: object
      description: >-
        One tool-call streamed across many deltas. `id` and `function.name`
        appear once (in the first delta); `function.arguments` is a JSON
        string FRAGMENT that consumers concat across deltas by `index` before
        parsing.
      properties:
        index: { type: integer, description: "Position in the tool_calls array; deltas with the same index belong to the same call." }
        id: { type: string }
        type: { type: string, enum: [function] }
        function:
          type: object
          properties:
            name: { type: string }
            arguments: { type: string, description: "JSON string fragment; concat across deltas of the same index before parsing." }
    Delta:
      type: object
      description: Partial assistant message delta carried by one ChatCompletionChunk choice.
      properties:
        role: { type: string }
        content: { type: string, description: "Token / text fragment to append to assistant content." }
        tool_calls:
          type: array
          description: Streamed tool-call fragments — see ToolCallDelta.
          items: { $ref: "#/components/schemas/ToolCallDelta" }
    ChunkChoice:
      type: object
      properties:
        index: { type: integer }
        delta: { $ref: "#/components/schemas/Delta" }
        finish_reason:
          type: string
          nullable: true
          enum: [stop, length, content_filter, tool_calls, null]
    ChatCompletionChunk:
      type: object
      description: >-
        One SSE event payload when stream=true. Three event-shapes share this
        schema (see SSE event taxonomy in info.description):
        (a) content/tool-call delta — `choices` populated, `usage` absent;
        (b) terminal usage event — `choices: []`, `usage` populated, emitted
        only when `request.stream_options.include_usage = true`;
        (c) the `[DONE]` line is NOT a ChatCompletionChunk — it's the literal
        string `[DONE]` and ends the stream.
      required: [id, object, choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion.chunk }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items: { $ref: "#/components/schemas/ChunkChoice" }
        usage:
          $ref: "#/components/schemas/Usage"
    StreamError:
      type: object
      description: >-
        Mid-stream error event. Shaped as RFC 7807 Problem Details
        (contracts/problem-details.openapi.yaml). When a consumer sees a
        `data: …` line whose JSON has a `type` URI matching the
        agentarmy/contracts/problems/ namespace, it MUST treat the stream as
        terminated abnormally and surface this error. The gateway closes the
        connection without emitting `[DONE]` after a StreamError.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        trace_id: { type: string }
    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
    EmbeddingResponse:
      type: object
      properties:
        object: { type: string, const: list }
        model: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string, const: embedding }
              index: { type: integer }
              embedding: { type: array, items: { type: number } }
        usage: { $ref: "#/components/schemas/Usage" }
    Model:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: model }
        owned_by: { type: string, description: "The backing provider (openai|cerebras|foundry|local)." }
    ModelList:
      type: object
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Model" }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
