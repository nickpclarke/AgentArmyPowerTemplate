openapi: 3.1.0
info:
  title: AgentArmy Webhook Receiver
  version: 0.1.0
  description: >-
    Inbound HTTP surface for the AgentArmy event-bridge
    (`templates/event-bridge-image/`). Receives signed third-party webhooks
    (GitHub HMAC-SHA256 to start), verifies the signature constant-time, dedups
    by delivery id (5-min TTL replay protection), wraps the payload as a
    CloudEvents v1.0 envelope, and publishes to NATS JetStream stream FLEET on
    subject `fleet.<source>.<event>` (e.g. `fleet.gh.pull_request`). Realizes
    the inbound half of ARC-ADR-022. The broker-side contract (NATS subjects +
    CloudEvents envelope) is registered separately as "Event bus".
servers:
  - url: "{WEBHOOK_RECEIVER_URL}"
    description: Host-only base; the bridge listens on PORT (default 8080).
    variables:
      WEBHOOK_RECEIVER_URL:
        default: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthz
      summary: Liveness — receiver up + NATS URL echo
      responses:
        "200":
          description: Healthy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /webhooks/github:
    post:
      operationId: githubWebhook
      summary: Receive a signed GitHub webhook → publish a CloudEvent to NATS
      description: >-
        Verifies `X-Hub-Signature-256` (HMAC-SHA256, constant-time compare via
        `hmac.compare_digest`). Dedups by `X-GitHub-Delivery` for 5 min.
        Wraps the raw body as a CloudEvents v1.0 envelope and publishes via
        JetStream to subject `fleet.gh.<X-GitHub-Event>` in stream FLEET.
      parameters:
        - in: header
          name: X-Hub-Signature-256
          required: true
          schema:
            type: string
            pattern: "^sha256=[0-9a-f]{64}$"
            example: "sha256=……"
        - in: header
          name: X-GitHub-Event
          required: true
          schema:
            type: string
            example: pull_request
        - in: header
          name: X-GitHub-Delivery
          required: true
          schema:
            type: string
            format: uuid
            example: "0d2d8b1a-1f2e-4b8a-9c3a-1f1e2d3c4b5a"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: GitHub webhook event payload (verbatim from GitHub).
      responses:
        "202":
          description: Accepted — CloudEvent published to NATS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishAck" }
        "200":
          description: Duplicate delivery — already published earlier (replay-protected).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateAck" }
        "401":
          description: Missing or invalid HMAC signature.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Configuration error (e.g. webhook secret not provided to the bridge).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    Health:
      type: object
      required: [status, nats]
      properties:
        status:
          type: string
          const: ok
        nats:
          type: string
          description: NATS URL the receiver publishes to.
          example: "nats://nats:4222"
    PublishAck:
      type: object
      required: [status, subject, id, type, stream, seq]
      properties:
        status:
          type: string
          const: published
        subject:
          type: string
          example: "fleet.gh.pull_request"
        id:
          type: string
          description: CloudEvents id (= X-GitHub-Delivery).
        type:
          type: string
          example: "github.pull_request"
        stream:
          type: string
          example: FLEET
        seq:
          type: integer
          description: JetStream sequence number.
    DuplicateAck:
      type: object
      required: [status, delivery]
      properties:
        status:
          type: string
          const: duplicate
        delivery:
          type: string
          description: The X-GitHub-Delivery that was seen previously.
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: "bad signature"
