```

## Project Discovery

```bash
# list projects for a user
gh project list --owner <user-or-org>

# list projects for a repo's org
gh project list --owner <org>

# get project details
gh project view <number> --owner <org>

# get project fields (custom fields, iterations)
gh project field-list <number> --owner <org>
```

## Common Operations

### Read project items
```bash
# list all items in a project
gh project item-list <number> --owner <org> --limit 100

# output as JSON for parsing
gh project item-list <number> --owner <org> --format json
```

### Add issue/PR to project
```bash
# add by issue URL
gh project item-add <number> --owner <org> --url <issue-url>

# add current repo's issue
gh project item-add <number> --owner <org> --url "https://github.com/<owner>/<repo>/issues/<n>"
```

### Update item fields (status, priority, iteration)
```bash
# requires field ID and option ID — fetch with field-list first
gh project item-edit \\
  --project-id <project-node-id> \\
  --id <item-node-id> \\
  --field-id <field-node-id> \\
  --single-select-option-id <option-node-id>
```

### GraphQL for Projects v2 (advanced queries)

```graphql
# query project items with custom fields
query {
  organization(login: "ORG") {
    projectV2(number: PROJECT_NUMBER) {
      title
      items(first: 50) {
        nodes {
          id
          content {
            ... on Issue {
              title
              number
              state
              assignees(first: 5) { nodes { login } }
              labels(first: 5) { nodes { name } }
            }
            ... on PullRequest {
              title
              number
              state
            }
          }
          fieldValues(first: 10) {
            nodes {
              ... on ProjectV2ItemFieldSingleSelectValue {
                name
                field { ... on ProjectV2SingleSelectField { name } }
              }
              ... on ProjectV2ItemFieldIterationValue {
                title
                startDate
                duration
                field { ... on ProjectV2IterationField { name } }
              }
              ... on ProjectV2ItemFieldTextValue {
                text
                field { ... on ProjectV2Field { name } }
              }
            }
          }
        }
      }
    }
  }
}
```

Run with:
```bash
gh api graphql -f query='<query above>'
```

### Create a new project
```bash
gh project create --owner <org> --title "Sprint Board"
```

### Create project with template fields
Use GraphQL mutation after creation:
```graphql
mutation {
  addProjectV2Field(input: {
    projectId: "PROJECT_NODE_ID"
    dataType: SINGLE_SELECT
    name: "Status"
  }) {
    projectV2Field {
      ... on ProjectV2SingleSelectField {
        id
        name
      }
    }
  }
}
```

## Workflow Patterns

### Triage workflow: move open issues into a project
```bash
#!/usr/bin/env bash
OWNER="myorg"
REPO="myrepo"
PROJECT_NUMBER=5

gh issue list --repo "$OWNER/$REPO" --state open --json url --jq '.[].url' | \\
  while read url; do
    gh project item-add $PROJECT_NUMBER --owner "$OWNER" --url "$url"
    echo "Added: $url"
  done
```

### Status report: count items by status field
```bash
gh project item-list $PROJECT_NUMBER --owner $OWNER --format json | \\
  jq '[.items[].status] | group_by(.) | map({status: .[0], count: length})'
```

### Sync milestone issues to a project
```bash
MILESTONE_NUMBER=3
gh issue list --repo "$OWNER/$REPO" \\
  --milestone "$MILESTONE_NUMBER" \\
  --json url --jq '.[].url' | \\
  xargs -I{} gh project item-add $PROJECT_NUMBER --owner "$OWNER" --url {}
```

## MCP Server Setup (if not already configured)

If the GitHub MCP server is not yet in `.claude/settings.json`:
```json
{
  "mcpServers": {
    "github": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-github"],
      "env": {
        "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
      }
    }
  }
}
```

Required token scopes: `repo`, `project`, `read:org`.

## Error Handling

| Error | Cause | Fix |
|---|---|---|
| `Resource not accessible by integration` | Missing `project` scope | Re-auth: `gh auth refresh -s project` |
| `Could not resolve to a ProjectV2` | Wrong project number or owner | Run `gh project list --owner <org>` to confirm |
| `Field not found` | Field name mismatch | Run `gh project field-list <n> --owner <org>` |
| `Rate limited` | Too many API calls | Add `sleep 0.5` between bulk operations |

