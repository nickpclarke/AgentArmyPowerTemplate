### Operating Model Design

**Operating Model Canvas (9 dimensions):**

1. **Funding Model** — how the unit is funded (cost center, profit center, product group, shared service)
2. **Performance Model** — what metrics define success (OKRs, KPIs, SLAs)
3. **Governance Model** — decision rights, escalation paths, ARB, steering committees
4. **Talent Model** — skills needed, org structure, span of control, workforce strategy
5. **Process Model** — key processes, automation level, process ownership
6. **Technology Model** — enabling technologies, platforms, integration model
7. **Channel Model** — how capability is delivered (self-service, assisted, partner)
8. **Supplier Model** — what is outsourced, partner relationships, vendor management
9. **Location Model** — geographic distribution, remote/onsite model, data sovereignty

**Operating model archetypes for US context:**
- **Replication Model** — same process replicated across business units (franchise model)
- **Unification Model** — standardized processes with global data (most shared services, federal agencies)
- **Diversification Model** — separate processes per unit, minimal integration (holding companies, conglomerates)
- **Coordination Model** — autonomous units with shared customer data (multi-product companies)

Platform Engineering operating model uses **Coordination Model** internally with a **Product Model** for the platform team (IDP as a product with internal customers).

### Stakeholder Analysis

**Power/Interest Grid:**
- High Power, High Interest → Manage Closely (Architecture Sponsors)
- High Power, Low Interest → Keep Satisfied (Executive stakeholders)
- Low Power, High Interest → Keep Informed (Architecture practitioners)
- Low Power, Low Interest → Monitor (Peripheral stakeholders)

**Stakeholder engagement plan:**
```
Stakeholder: [Name/Role]
Class: [Sponsor | Decision Maker | User | Influencer | Affected Party]
Power: [H/M/L]
Interest: [H/M/L]
Concerns: [What they care about — their frame]
Position: [Champion | Supporter | Neutral | Critic | Blocker]
Engagement approach: [How to engage them]
Frequency: [How often to engage]
Communication format: [What format resonates — data, narrative, visual]
```

## US-Specific Business Architecture Contexts

### Federal Government
Apply the FEAF Business Reference Model:
- Services for Citizens (delivery of services to the public)
- Support Delivery of Services (internal support capabilities)
- Management of Government Resources (cross-cutting government management)
- Mode of Delivery (how services are delivered — channels)

Map capabilities to Program Activities in the Budget. Capability ownership aligns to Program Management Offices. Value streams align to mission delivery processes.

### Defense/DoD
Apply DoDAF SV-5 (System Function Traceability Matrix) alongside business capability mapping. Capabilities align to Mission Areas in JCIDS.

### Healthcare
HCMF (Healthcare Capability Model Framework) alignment. Capabilities must include:
- Clinical (direct patient care)
- Clinical Support (lab, pharmacy, imaging)
- Administrative (billing, scheduling, HR)
- Research (for academic medical centers)

### Financial Services
Align to FIBO (Financial Industry Business Ontology) for data architecture integration. Capability model must reflect:
- Front Office (revenue-generating)
- Middle Office (risk, compliance)
- Back Office (operations, settlement)

