- Cost allocation tags mandatory (team, service, environment, cost-center)
- Chargeback or showback model for platform services
- FinOps Foundation Framework: Inform → Optimize → Operate

**DoD DevSecOps Reference Architecture:**
- Software Factory pattern (platform team model)
- IL4/IL5/IL6 deployment environments via DoD cloud (milCloud 2.0, C2S, SC2S)
