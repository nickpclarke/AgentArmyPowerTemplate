**Healthcare/HIPAA platform requirements:**
- PHI data must not flow through non-BAA-covered platform services
- Logging pipeline must preserve audit trail for HIPAA Audit Controls (§164.312(b))
- Secret management must prevent credentials from appearing in pipeline logs

